<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Hub - Spotify Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #202124;
      color: #e8eaed;

      font-family:
        Arial,
        Roboto,
        sans-serif;
    }

    .box {
      width: 320px;

      padding: 28px;

      background: #292a2d;

      border: 1px solid #3c4043;

      border-radius: 14px;

      text-align: center;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .status {
      color: #9aa0a6;
      font-size: 13px;

      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>My Hub</h2>

  <div
    id="status"
    class="status"
  >
    Connecting to Spotify...
  </div>

</div>


<script>

/* =========================================
   CONFIG
========================================= */

const CLIENT_ID =
  "d3445d44d1314d07b1d7a7904bbe5a48";

const REDIRECT_URI =
  "https://dexxx02348.github.io/my-hub/auth.html";

const HUB_ORIGIN =
  "https://dexxx02348.github.io";

const SCOPES = [
  "user-read-playback-state",
  "user-modify-playback-state",
  "user-read-currently-playing"
].join(" ");


/* =========================================
   RANDOM STRING
========================================= */

function randomString(length) {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

  const array =
    new Uint8Array(length);

  crypto.getRandomValues(array);

  let result = "";

  for (let i = 0; i < length; i++) {

    result +=
      chars[array[i] % chars.length];

  }

  return result;

}


/* =========================================
   SHA256
========================================= */

async function sha256(value) {

  const data =
    new TextEncoder().encode(value);

  return crypto.subtle.digest(
    "SHA-256",
    data
  );

}


/* =========================================
   BASE64 URL
========================================= */

function base64url(buffer) {

  return btoa(
    String.fromCharCode(
      ...new Uint8Array(buffer)
    )
  )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");

}


/* =========================================
   START SPOTIFY LOGIN
========================================= */

async function startLogin() {

  const verifier =
    randomString(64);

  const state =
    randomString(32);

  const challenge =
    base64url(
      await sha256(verifier)
    );

  sessionStorage.setItem(
    "pkce_verifier",
    verifier
  );

  sessionStorage.setItem(
    "oauth_state",
    state
  );


  const params =
    new URLSearchParams({

      client_id:
        CLIENT_ID,

      response_type:
        "code",

      redirect_uri:
        REDIRECT_URI,

      scope:
        SCOPES,

      state:
        state,

      code_challenge_method:
        "S256",

      code_challenge:
        challenge

    });


  window.location.href =
    "https://accounts.spotify.com/authorize?" +
    params.toString();

}


/* =========================================
   EXCHANGE CODE FOR TOKEN
========================================= */

async function finishLogin(
  code,
  state
) {

  const savedState =
    sessionStorage.getItem(
      "oauth_state"
    );

  const verifier =
    sessionStorage.getItem(
      "pkce_verifier"
    );


  if (!verifier) {

    throw new Error(
      "PKCE verifier missing."
    );

  }


  if (
    !state ||
    state !== savedState
  ) {

    throw new Error(
      "Spotify login state mismatch."
    );

  }


  const body =
    new URLSearchParams({

      client_id:
        CLIENT_ID,

      grant_type:
        "authorization_code",

      code:
        code,

      redirect_uri:
        REDIRECT_URI,

      code_verifier:
        verifier

    });


  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "application/x-www-form-urlencoded"

        },

        body:
          body.toString()

      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(
      data.error_description ||
      data.error ||
      "Spotify token exchange failed."
    );

  }


  const expiresAt =
    Date.now() +
    data.expires_in * 1000;


  /*
    Send the token back to the
    My Hub panel that opened this window.
  */

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {

        type:
          "myhub-spotify-connected",

        access_token:
          data.access_token,

        refresh_token:
          data.refresh_token || "",

        expires_at:
          expiresAt

      },

      HUB_ORIGIN

    );

  }


  document.getElementById(
    "status"
  ).textContent =
    "Spotify connected! Closing...";


  sessionStorage.removeItem(
    "pkce_verifier"
  );

  sessionStorage.removeItem(
    "oauth_state"
  );


  setTimeout(
    () => {

      window.close();

    },
    800
  );

}


/* =========================================
   MAIN
========================================= */

async function main() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const error =
    params.get("error");


  if (error) {

    document.getElementById(
      "status"
    ).textContent =
      "Spotify authorization was cancelled.";

    return;

  }


  const code =
    params.get("code");


  if (!code) {

    await startLogin();

    return;

  }


  try {

    await finishLogin(
      code,
      params.get("state")
    );

  } catch (error) {

    document.getElementById(
      "status"
    ).textContent =
      error.message;

  }

}


main();

</script>

</body>
</html>
