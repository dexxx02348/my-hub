<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Hub — Spotify</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e1014;color:#f3f5f7;font-family:system-ui,Arial,sans-serif}
.card{width:min(360px,calc(100% - 32px));padding:24px;border:1px solid #2b3039;border-radius:16px;background:#171a20;text-align:center}
h1{font-size:20px;margin:0 0 8px}.p{color:#9199a5;font-size:12px;line-height:1.5}.ok{color:#6ee7a4}.bad{color:#ff8f8f}
</style>
</head>
<body>
<div class="card">
<h1>My Hub × Spotify</h1>
<div id="msg" class="p">Finishing Spotify sign-in…</div>
</div>
<script>
(async()=>{
"use strict";
const CLIENT_ID="d3445d44d1314d07b1d7a7904bbe5a48";
const REDIRECT="https://dexxx02348.github.io/my-hub/auth.html";
const msg=document.getElementById("msg");
const q=new URLSearchParams(location.search);
const err=q.get("error"); const code=q.get("code");
function tell(type,extra={}){if(window.opener)window.opener.postMessage({type,...extra},"https://dexxx02348.github.io")}
if(err){msg.textContent="Spotify authorization was cancelled.";msg.className="p bad";tell("spotify-auth-error",{error:err});return}
if(!code){msg.textContent="No authorization code was received.";msg.className="p bad";return}
try{
 const verifier=localStorage.getItem("spotify_pkce_verifier");
 if(!verifier)throw new Error("Missing PKCE verifier.");
 const r=await fetch("https://accounts.spotify.com/api/token",{
   method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
   body:new URLSearchParams({
     client_id:CLIENT_ID,grant_type:"authorization_code",code,redirect_uri:REDIRECT,code_verifier:verifier
   })
 });
 const d=await r.json();
 if(!r.ok)throw new Error(d.error_description||d.error||"Token exchange failed.");
 localStorage.setItem("spotify_access_token",d.access_token);
 if(d.refresh_token)localStorage.setItem("spotify_refresh_token",d.refresh_token);
 localStorage.setItem("spotify_expires_at",String(Date.now()+d.expires_in*1000));
 localStorage.removeItem("spotify_pkce_verifier");
 msg.textContent="Spotify connected. You can close this tab.";
 msg.className="p ok";
 tell("spotify-auth-success");
 if(window.opener) setTimeout(()=>window.close(),700);
}catch(e){
 msg.textContent=e.message||"Could not connect Spotify.";
 msg.className="p bad";
 tell("spotify-auth-error",{error:e.message||"unknown"});
}
})();
</script>
</body>
</html>
