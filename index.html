<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Spotify Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #202124;
      color: white;
      padding: 30px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    #info {
      margin: 20px 0;
      padding: 15px;
      background: #292a2d;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>My Hub Spotify Test</h1>

<div id="info">Checking Spotify...</div>

<button onclick="play()">▶ Play</button>
<button onclick="pause()">⏸ Pause</button>
<button onclick="previous()">⏮ Previous</button>
<button onclick="next()">⏭ Next</button>

<script>
  const CLIENT_ID = "d3445d44d1314d07b1d7a7904bbe5a48";
async function spotifyRequest(url, options = {}) {
  const token = localStorage.getItem("spotify_access_token");

  if (!token) {
    document.getElementById("info").textContent =
      "Not connected to Spotify.";
    return null;
  }

  const response = await fetch(
    "https://api.spotify.com/v1" + url,
    {
      ...options,
      headers: {
        ...(options.headers || {}),
        Authorization: "Bearer " + token
      }
    }
  );

  if (!response.ok) {
    const text = await response.text();
    console.log(text);
    document.getElementById("info").textContent =
      "Spotify returned error " + response.status;
    return null;
  }

  if (response.status === 204) return true;

  return response.json();
}

async function getCurrentSong() {
  const data = await spotifyRequest(
    "/me/player/currently-playing"
  );

  if (!data || !data.item) {
    document.getElementById("info").textContent =
      "Nothing is currently playing.";
    return;
  }

  const artists = data.item.artists
    .map(a => a.name)
    .join(", ");

  document.getElementById("info").textContent =
    data.is_playing
      ? "▶ " + data.item.name + " — " + artists
      : "⏸ " + data.item.name + " — " + artists;
}

async function play() {
  await spotifyRequest("/me/player/play", {
    method: "PUT"
  });

  setTimeout(getCurrentSong, 500);
}

async function pause() {
  await spotifyRequest("/me/player/pause", {
    method: "PUT"
  });

  setTimeout(getCurrentSong, 500);
}

async function previous() {
  await spotifyRequest("/me/player/previous", {
    method: "POST"
  });

  setTimeout(getCurrentSong, 700);
}

async function next() {
  await spotifyRequest("/me/player/next", {
    method: "POST"
  });

  setTimeout(getCurrentSong, 700);
}

getCurrentSong();
</script>

</body>
</html>
