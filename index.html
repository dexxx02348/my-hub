<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Hub</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Roboto, sans-serif;
  background: #202124;
  color: #e8eaed;
}

body {
  padding: 12px;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  max-width: 900px;
  margin: 0 auto;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.title {
  font-size: 20px;
  font-weight: 500;
}

.small {
  color: #9aa0a6;
  font-size: 12px;
}

.card {
  background: #292a2d;
  border: 1px solid #3c4043;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}

.section-title {
  color: #9aa0a6;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .55px;
  margin-bottom: 10px;
}

.spotify-main {
  display: grid;
  grid-template-columns: 76px 1fr;
  gap: 12px;
  align-items: center;
}

.art {
  width: 76px;
  height: 76px;
  border-radius: 8px;
  object-fit: cover;
  background: #3c4043;
}

.song {
  min-width: 0;
}

.song-name {
  font-size: 15px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artist {
  color: #9aa0a6;
  font-size: 13px;
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.progress-wrap {
  margin-top: 12px;
}

input[type="range"] {
  width: 100%;
  accent-color: #8ab4f8;
  cursor: pointer;
}

.progress-labels {
  display: flex;
  justify-content: space-between;
  color: #9aa0a6;
  font-size: 10px;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 10px;
}

.ctrl {
  min-width: 36px;
  height: 34px;
  padding: 0 10px;
  border: 0;
  border-radius: 8px;
  background: #35363a;
  color: #e8eaed;
}

.ctrl:hover {
  background: #45464a;
}

.play {
  background: #8ab4f8;
  color: #202124;
  min-width: 72px;
  font-weight: 500;
}

.play:hover {
  background: #a8c7fa;
}

.volume {
  margin-top: 10px;
}

.quick-grid,
.game-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.link-btn,
.game-btn {
  border: 1px solid #3c4043;
  background: #292a2d;
  color: #e8eaed;
  border-radius: 8px;
  height: 38px;
  text-align: left;
  padding: 0 11px;
}

.link-btn:hover,
.game-btn:hover {
  background: #35363a;
}

.status {
  color: #9aa0a6;
  font-size: 12px;
  margin-top: 9px;
}

.hidden {
  display: none !important;
}

.login-box {
  text-align: center;
  padding: 35px 20px;
}

.login-btn {
  margin-top: 12px;
  border: 0;
  border-radius: 9px;
  padding: 11px 18px;
  background: #8ab4f8;
  color: #202124;
  font-weight: 500;
}

.game-area {
  margin-top: 10px;
  min-height: 260px;
}

canvas {
  display: block;
  width: 100%;
  max-width: 320px;
  margin: 0 auto;
  background: #202124;
  border: 1px solid #3c4043;
  border-radius: 10px;
}

.game-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 9px;
}

.back-btn {
  border: 1px solid #3c4043;
  background: #292a2d;
  color: #e8eaed;
  border-radius: 8px;
  padding: 7px 10px;
}

@media (max-width: 420px) {
  .spotify-main {
    grid-template-columns: 64px 1fr;
  }

  .art {
    width: 64px;
    height: 64px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="title">My Hub</div>
    <div class="small" id="connection">Checking...</div>
  </div>

  <div id="loginCard" class="card login-box hidden">
    <div class="title">Connect Spotify</div>
    <div class="small" style="margin-top:7px;">
      Connect your Spotify account to control playback.
    </div>
    <button class="login-btn" id="loginBtn">Connect Spotify</button>
  </div>

  <div id="mainUI" class="hidden">

    <div class="card">
      <div class="section-title">Spotify</div>

      <div class="spotify-main">
        <img id="art" class="art" src="" alt="">
        <div class="song">
          <div id="songName" class="song-name">Nothing playing</div>
          <div id="artistName" class="artist">Open Spotify and start playing something</div>
        </div>
      </div>

      <div class="progress-wrap">
        <input id="progress" type="range" min="0" max="1000" value="0">
        <div class="progress-labels">
          <span id="currentTime">0:00</span>
          <span id="totalTime">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl" id="previous">⏮</button>
        <button class="ctrl" id="back10">−10</button>
        <button class="ctrl play" id="playPause">▶ Play</button>
        <button class="ctrl" id="forward10">+10</button>
        <button class="ctrl" id="next">⏭</button>
      </div>

      <div class="volume">
        <input id="volume" type="range" min="0" max="100" value="50">
      </div>

      <div class="status" id="spotifyStatus">
        Ready
      </div>
    </div>

    <div class="card">
      <div class="section-title">Quick Links</div>

      <div class="quick-grid">
        <button class="link-btn" data-url="https://www.google.com">Google</button>
        <button class="link-btn" data-url="https://www.youtube.com">YouTube</button>
        <button class="link-btn" data-url="https://drive.google.com">Google Drive</button>
        <button class="link-btn" data-url="https://github.com">GitHub</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Mini Games</div>

      <div id="gameMenu" class="game-grid">
        <button class="game-btn" id="snakeBtn">🐍 Snake</button>
        <button class="game-btn" id="reactionBtn">⚡ Reaction</button>
        <button class="game-btn" id="guessBtn">🔢 Number Guess</button>
        <button class="game-btn" id="clickBtn">🖱 Clicker</button>
      </div>

      <div id="gameArea" class="game-area hidden"></div>
    </div>

  </div>
</div>

<script>
/* =========================
   CONFIG
========================= */

const CLIENT_ID = "d3445d44d1314d07b1d7a7904bbe5a48";
const REDIRECT_URI =
  "https://dexxx02348.github.io/my-hub/";

const SCOPES = [
  "user-read-playback-state",
  "user-modify-playback-state",
  "user-read-currently-playing"
].join(" ");


/* =========================
   SPOTIFY AUTH
========================= */

function randomString(length) {
  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

  const array = new Uint8Array(length);
  crypto.getRandomValues(array);

  let result = "";

  for (let i = 0; i < length; i++) {
    result += chars[array[i] % chars.length];
  }

  return result;
}

async function sha256(value) {
  const data = new TextEncoder().encode(value);
  return crypto.subtle.digest("SHA-256", data);
}

function base64url(buffer) {
  return btoa(
    String.fromCharCode(...new Uint8Array(buffer))
  )
  .replace(/\+/g, "-")
  .replace(/\//g, "_")
  .replace(/=+$/, "");
}

async function login() {
  const verifier = randomString(64);

  localStorage.setItem(
    "pkce_verifier",
    verifier
  );

  const challenge = base64url(
    await sha256(verifier)
  );

  const state = randomString(32);

  localStorage.setItem(
    "oauth_state",
    state
  );

  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: "code",
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    state,
    code_challenge_method: "S256",
    code_challenge: challenge
  });

  window.location.href =
    "https://accounts.spotify.com/authorize?" +
    params.toString();
}

async function exchangeCode(code) {
  const verifier =
    localStorage.getItem("pkce_verifier");

  if (!verifier) {
    throw new Error("Missing PKCE verifier.");
  }

  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: "authorization_code",
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });

  const response = await fetch(
    "https://accounts.spotify.com/api/token",
    {
      method: "POST",
      headers: {
        "Content-Type":
          "application/x-www-form-urlencoded"
      },
      body: body.toString()
    }
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(
      data.error_description ||
      data.error ||
      "Token exchange failed."
    );
  }

  localStorage.setItem(
    "spotify_access_token",
    data.access_token
  );

  if (data.refresh_token) {
    localStorage.setItem(
      "spotify_refresh_token",
      data.refresh_token
    );
  }

  localStorage.setItem(
    "spotify_expires_at",
    String(
      Date.now() + (data.expires_in * 1000)
    )
  );

  localStorage.removeItem("pkce_verifier");
  localStorage.removeItem("oauth_state");

  history.replaceState(
    {},
    document.title,
    REDIRECT_URI
  );
}

async function refreshToken() {
  const refresh =
    localStorage.getItem("spotify_refresh_token");

  if (!refresh) {
    throw new Error("No refresh token.");
  }

  const body = new URLSearchParams({
    grant_type: "refresh_token",
    refresh_token: refresh,
    client_id: CLIENT_ID
  });

  const response = await fetch(
    "https://accounts.spotify.com/api/token",
    {
      method: "POST",
      headers: {
        "Content-Type":
          "application/x-www-form-urlencoded"
      },
      body: body.toString()
    }
  );

  const data = await response.json();

  if (!response.ok) {
    if (data.error === "invalid_grant") {
      localStorage.removeItem(
        "spotify_access_token"
      );
      localStorage.removeItem(
        "spotify_refresh_token"
      );
    }

    throw new Error(
      data.error_description ||
      data.error ||
      "Refresh failed."
    );
  }

  localStorage.setItem(
    "spotify_access_token",
    data.access_token
  );

  if (data.refresh_token) {
    localStorage.setItem(
      "spotify_refresh_token",
      data.refresh_token
    );
  }

  localStorage.setItem(
    "spotify_expires_at",
    String(
      Date.now() + (data.expires_in * 1000)
    )
  );

  return data.access_token;
}

async function getToken() {
  const token =
    localStorage.getItem(
      "spotify_access_token"
    );

  const expiry =
    Number(
      localStorage.getItem(
        "spotify_expires_at"
      ) || 0
    );

  if (
    token &&
    Date.now() < expiry - 60000
  ) {
    return token;
  }

  return refreshToken();
}


/* =========================
   SPOTIFY API
========================= */

async function spotifyFetch(
  endpoint,
  options = {},
  retry = true
) {
  try {

    const token = await getToken();

    const response = await fetch(
      "https://api.spotify.com/v1" + endpoint,
      {
        ...options,
        headers: {
          ...(options.headers || {}),
          Authorization:
            "Bearer " + token
        }
      }
    );

    if (
      response.status === 401 &&
      retry
    ) {
      await refreshToken();

      return spotifyFetch(
        endpoint,
        options,
        false
      );
    }

    if (
      response.status === 204
    ) {
      return null;
    }

    const text =
      await response.text();

    const data =
      text ? JSON.parse(text) : null;

    if (!response.ok) {
      throw new Error(
        data?.error?.message ||
        "Spotify request failed (" +
        response.status +
        ")"
      );
    }

    return data;

  } catch (error) {
    throw error;
  }
}


/* =========================
   PLAYER
========================= */

let playback = null;
let progressTimer = null;

const art =
  document.getElementById("art");

const songName =
  document.getElementById("songName");

const artistName =
  document.getElementById("artistName");

const progress =
  document.getElementById("progress");

const currentTime =
  document.getElementById("currentTime");

const totalTime =
  document.getElementById("totalTime");

const playPause =
  document.getElementById("playPause");

const spotifyStatus =
  document.getElementById("spotifyStatus");

function formatTime(ms) {
  const totalSeconds =
    Math.floor(ms / 1000);

  const minutes =
    Math.floor(totalSeconds / 60);

  const seconds =
    String(
      totalSeconds % 60
    ).padStart(2, "0");

  return minutes + ":" + seconds;
}

async function updatePlayback() {

  try {

    playback =
      await spotifyFetch(
        "/me/player"
      );

    if (
      !playback ||
      !playback.item
    ) {
      songName.textContent =
        "Nothing playing";

      artistName.textContent =
        "Open Spotify and start playing something";

      art.removeAttribute("src");

      playPause.textContent =
        "▶ Play";

      spotifyStatus.textContent =
        "No active playback";

      return;
    }

    const item =
      playback.item;

    songName.textContent =
      item.name || "Unknown";

    artistName.textContent =
      (item.artists || [])
      .map(a => a.name)
      .join(", ") ||
      "Unknown artist";

    const image =
      item.album?.images?.[1]?.url ||
      item.album?.images?.[0]?.url;

    if (image) {
      art.src = image;
    }

    playPause.textContent =
      playback.is_playing
        ? "⏸ Pause"
        : "▶ Play";

    spotifyStatus.textContent =
      playback.device
        ? "Device: " +
          playback.device.name
        : "Connected";

    const duration =
      item.duration_ms || 0;

    const position =
      playback.progress_ms || 0;

    totalTime.textContent =
      formatTime(duration);

    currentTime.textContent =
      formatTime(position);

    progress.value =
      duration
        ? Math.floor(
            (position / duration) * 1000
          )
        : 0;

    document.getElementById(
      "volume"
    ).value =
      playback.device?.volume_percent ??
      50;

  } catch (error) {

    spotifyStatus.textContent =
      error.message;

  }
}

function startProgressAnimation() {

  clearInterval(progressTimer);

  progressTimer =
    setInterval(() => {

      if (
        !playback ||
        !playback.item ||
        !playback.is_playing
      ) {
        return;
      }

      const duration =
        playback.item.duration_ms || 0;

      playback.progress_ms =
        Math.min(
          duration,
          (playback.progress_ms || 0) + 1000
        );

      currentTime.textContent =
        formatTime(
          playback.progress_ms
        );

      progress.value =
        duration
          ? Math.floor(
              playback.progress_ms /
              duration *
              1000
            )
          : 0;

    }, 1000);
}

async function playPauseSpotify() {

  try {

    if (
      playback?.is_playing
    ) {

      await spotifyFetch(
        "/me/player/pause",
        { method: "PUT" }
      );

    } else {

      await spotifyFetch(
        "/me/player/play",
        { method: "PUT" }
      );

    }

    await updatePlayback();

  } catch (error) {

    spotifyStatus.textContent =
      error.message;

  }
}

async function previousSpotify() {

  try {

    await spotifyFetch(
      "/me/player/previous",
      { method: "POST" }
    );

    setTimeout(
      updatePlayback,
      500
    );

  } catch (error) {

    spotifyStatus.textContent =
      error.message;

  }
}

async function nextSpotify() {

  try {

    await spotifyFetch(
      "/me/player/next",
      { method: "POST" }
    );

    setTimeout(
      updatePlayback,
      500
    );

  } catch (error) {

    spotifyStatus.textContent =
      error.message;

  }
}

async function seekBy(amount) {

  if (!playback?.item) return;

  const duration =
    playback.item.duration_ms;

  const current =
    playback.progress_ms || 0;

  const target =
    Math.max(
      0,
      Math.min(
        duration,
        current + amount
      )
    );

  try {

    await spotifyFetch(
      "/me/player/seek?position_ms=" +
      encodeURIComponent(target),
      { method: "PUT" }
    );

    await updatePlayback();

  } catch (error) {

    spotifyStatus.textContent =
      error.message;

  }
}

async function setVolume(value) {

  try {

    await spotifyFetch(
      "/me/player/volume?volume_percent=" +
      encodeURIComponent(value),
      { method: "PUT" }
    );

  } catch (error) {

    spotifyStatus.textContent =
      error.message;

  }
}

progress.addEventListener(
  "change",
  async () => {

    if (!playback?.item) return;

    const duration =
      playback.item.duration_ms || 0;

    const target =
      Math.floor(
        (Number(progress.value) / 1000) *
        duration
      );

    try {

      await spotifyFetch(
        "/me/player/seek?position_ms=" +
        target,
        { method: "PUT" }
      );

      await updatePlayback();

    } catch (error) {

      spotifyStatus.textContent =
        error.message;

    }
  }
);

document.getElementById(
  "previous"
).onclick = previousSpotify;

document.getElementById(
  "next"
).onclick = nextSpotify;

document.getElementById(
  "back10"
).onclick = () => seekBy(-10000);

document.getElementById(
  "forward10"
).onclick = () => seekBy(10000);

playPause.onclick =
  playPauseSpotify;

document.getElementById(
  "volume"
).addEventListener(
  "change",
  event => {
    setVolume(event.target.value);
  }
);


/* =========================
   QUICK LINKS
========================= */

document
  .querySelectorAll(".link-btn")
  .forEach(button => {

    button.onclick = () => {

      window.open(
        button.dataset.url,
        "_blank"
      );

    };

  });


/* =========================
   GAMES
========================= */

const gameMenu =
  document.getElementById("gameMenu");

const gameArea =
  document.getElementById("gameArea");

function showGame(html) {

  gameMenu.classList.add("hidden");
  gameArea.classList.remove("hidden");

  gameArea.innerHTML = html;
}

function backToGames() {

  gameArea.classList.add("hidden");
  gameArea.innerHTML = "";
  gameMenu.classList.remove("hidden");

}

function addBackButton() {

  const button =
    document.createElement("button");

  button.textContent =
    "← Games";

  button.className =
    "back-btn";

  button.onclick =
    backToGames;

  return button;
}


/* Clicker */

document.getElementById(
  "clickBtn"
).onclick = () => {

  showGame(`
    <div class="game-top">
      <div>
        <div class="title">Clicker</div>
        <div class="small">How fast can you click?</div>
      </div>
    </div>

    <div style="text-align:center;">
      <div style="font-size:32px;margin:24px 0;">
        <span id="clickScore">0</span>
      </div>

      <button
        id="clickTarget"
        class="login-btn"
        style="font-size:20px;"
      >
        CLICK
      </button>
    </div>
  `);

  gameArea
    .querySelector(".game-top")
    .appendChild(
      addBackButton()
    );

  let score = 0;

  document.getElementById(
    "clickTarget"
  ).onclick = () => {

    score++;

    document.getElementById(
      "clickScore"
    ).textContent = score;

  };

};


/* Number Guess */

document.getElementById(
  "guessBtn"
).onclick = () => {

  showGame(`
    <div class="game-top">
      <div>
        <div class="title">Number Guess</div>
        <div class="small">Guess 1–100</div>
      </div>
    </div>

    <div style="text-align:center;">
      <input
        id="guessInput"
        type="number"
        min="1"
        max="100"
        style="
          width:100%;
          height:38px;
          padding:0 10px;
          background:#202124;
          color:white;
          border:1px solid #3c4043;
          border-radius:8px;
        "
      >

      <button
        id="guessSubmit"
        class="login-btn"
      >
        Guess
      </button>

      <div
        id="guessResult"
        class="status"
      >
        Start guessing.
      </div>
    </div>
  `);

  gameArea
    .querySelector(".game-top")
    .appendChild(
      addBackButton()
    );

  const answer =
    Math.floor(
      Math.random() * 100
    ) + 1;

  document.getElementById(
    "guessSubmit"
  ).onclick = () => {

    const guess =
      Number(
        document.getElementById(
          "guessInput"
        ).value
      );

    const result =
      document.getElementById(
        "guessResult"
      );

    if (!guess) return;

    if (guess === answer) {

      result.textContent =
        "🎉 You got it!";

    } else if (guess < answer) {

      result.textContent =
        "Too low.";

    } else {

      result.textContent =
        "Too high.";

    }

  };

};


/* Reaction */

document.getElementById(
  "reactionBtn"
).onclick = () => {

  showGame(`
    <div class="game-top">
      <div>
        <div class="title">Reaction</div>
        <div class="small" id="reactionText">
          Wait for GO...
        </div>
      </div>
    </div>

    <button
      id="reactionTarget"
      style="
        width:100%;
        height:190px;
        border:0;
        border-radius:12px;
        background:#35363a;
        color:#e8eaed;
        font-size:22px;
      "
    >
      WAIT
    </button>
  `);

  gameArea
    .querySelector(".game-top")
    .appendChild(
      addBackButton()
    );

  const target =
    document.getElementById(
      "reactionTarget"
    );

  const text =
    document.getElementById(
      "reactionText"
    );

  let ready = false;
  let start = 0;

  const delay =
    1200 +
    Math.random() * 2500;

  const timer =
    setTimeout(() => {

      ready = true;
      start = performance.now();

      target.textContent =
        "GO!";

      text.textContent =
        "CLICK!";

    }, delay);

  target.onclick = () => {

    if (!ready) {

      clearTimeout(timer);

      target.textContent =
        "Too early!";

      text.textContent =
        "Try again.";

      return;
    }

    const time =
      Math.round(
        performance.now() - start
      );

    target.textContent =
      time + " ms";

    text.textContent =
      "Nice!";

  };

};


/* Snake */

document.getElementById(
  "snakeBtn"
).onclick = () => {

  showGame(`
    <div class="game-top">
      <div>
        <div class="title">Snake</div>
        <div class="small">
          Use arrow keys
        </div>
      </div>
      <div id="snakeScore" class="small">
        Score: 0
      </div>
    </div>

    <canvas
      id="snakeCanvas"
      width="300"
      height="300"
    ></canvas>
  `);

  gameArea
    .querySelector(".game-top")
    .appendChild(
      addBackButton()
    );

  const canvas =
    document.getElementById(
      "snakeCanvas"
    );

  const ctx =
    canvas.getContext("2d");

  const size = 15;
  const cells = 20;

  let snake = [
    {x: 10, y: 10},
    {x: 9, y: 10},
    {x: 8, y: 10}
  ];

  let dx = 1;
  let dy = 0;

  let food = {
    x:
      Math.floor(
        Math.random() * cells
      ),
    y:
      Math.floor(
        Math.random() * cells
      )
  };

  let score = 0;
  let running = true;

  function draw() {

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.fillStyle = "#8ab4f8";

    snake.forEach(part => {

      ctx.fillRect(
        part.x * size,
        part.y * size,
        size - 1,
        size - 1
      );

    });

    ctx.fillStyle = "#e8eaed";

    ctx.fillRect(
      food.x * size,
      food.y * size,
      size - 1,
      size - 1
    );

  }

  function tick() {

    if (!running) return;

    const head = {
      x: snake[0].x + dx,
      y: snake[0].y + dy
    };

    if (
      head.x < 0 ||
      head.x >= cells ||
      head.y < 0 ||
      head.y >= cells ||
      snake.some(
        p =>
          p.x === head.x &&
          p.y === head.y
      )
    ) {

      running = false;

      document.getElementById(
        "snakeScore"
      ).textContent =
        "Game over — " + score;

      return;
    }

    snake.unshift(head);

    if (
      head.x === food.x &&
      head.y === food.y
    ) {

      score++;

      document.getElementById(
        "snakeScore"
      ).textContent =
        "Score: " + score;

      do {

        food = {
          x:
            Math.floor(
              Math.random() * cells
            ),
          y:
            Math.floor(
              Math.random() * cells
            )
        };

      } while (
        snake.some(
          p =>
            p.x === food.x &&
            p.y === food.y
        )
      );

    } else {

      snake.pop();

    }

    draw();

    setTimeout(
      tick,
      120
    );
  }

  document.onkeydown =
    event => {

      if (
        event.key === "ArrowUp" &&
        dy !== 1
      ) {
        dx = 0;
        dy = -1;
      }

      if (
        event.key === "ArrowDown" &&
        dy !== -1
      ) {
        dx = 0;
        dy = 1;
      }

      if (
        event.key === "ArrowLeft" &&
        dx !== 1
      ) {
        dx = -1;
        dy = 0;
      }

      if (
        event.key === "ArrowRight" &&
        dx !== -1
      ) {
        dx = 1;
        dy = 0;
      }

    };

  draw();
  tick();

};


/* =========================
   STARTUP
========================= */

async function init() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const code =
    params.get("code");

  const state =
    params.get("state");

  const savedState =
    localStorage.getItem(
      "oauth_state"
    );

  try {

    if (code) {

      if (
        state &&
        savedState &&
        state !== savedState
      ) {
        throw new Error(
          "OAuth state mismatch."
        );
      }

      await exchangeCode(code);

    }

    const token =
      localStorage.getItem(
        "spotify_access_token"
      );

    if (!token) {

      document.getElementById(
        "loginCard"
      ).classList.remove("hidden");

      document.getElementById(
        "connection"
      ).textContent =
        "Not connected";

      return;
    }

    document.getElementById(
      "mainUI"
    ).classList.remove("hidden");

    document.getElementById(
      "connection"
    ).textContent =
      "Spotify connected";

    await updatePlayback();

    startProgressAnimation();

    setInterval(
      updatePlayback,
      4000
    );

  } catch (error) {

    document.getElementById(
      "loginCard"
    ).classList.remove("hidden");

    document.getElementById(
      "connection"
    ).textContent =
      "Connection error";

    console.error(error);

  }

}

document.getElementById(
  "loginBtn"
).onclick = login;

init();
</script>
