<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Hub Spotify</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #202124;
      color: #e8eaed;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 320px;
      padding: 30px;
      background: #292a2d;
      border: 1px solid #3c4043;
      border-radius: 16px;
      text-align: center;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      background: #8ab4f8;
      color: #202124;
      font-weight: 500;
      cursor: pointer;
    }

    button:hover {
      background: #a8c7fa;
    }

    #result {
      margin-top: 15px;
      font-size: 13px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>My Hub</h1>
  <p>Spotify connection test</p>

  <button id="login">Connect Spotify</button>

  <div id="result"></div>
</div>

<script>
const CLIENT_ID = "d3445d44d1314d07b1d7a7904bbe5a48";

const REDIRECT_URI =
  "https://dexxx02348.github.io/my-hub/";

const SCOPES = [
  "user-read-playback-state",
  "user-modify-playback-state",
  "user-read-currently-playing"
].join(" ");

function randomString(length) {
  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

  let result = "";

  const array = new Uint8Array(length);
  crypto.getRandomValues(array);

  for (let i = 0; i < length; i++) {
    result += chars[array[i] % chars.length];
  }

  return result;
}

async function sha256(plain) {
  const encoder = new TextEncoder();
  const data = encoder.encode(plain);
  return await crypto.subtle.digest("SHA-256", data);
}

function base64urlEncode(buffer) {
  return btoa(
    String.fromCharCode(...new Uint8Array(buffer))
  )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

async function startLogin() {

  const verifier = randomString(64);

  localStorage.setItem("pkce_verifier", verifier);

  const challengeBuffer = await sha256(verifier);

  const challenge = base64urlEncode(challengeBuffer);

  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: "code",
    redirect_uri: REDIRECT_URI,
    code_challenge_method: "S256",
    code_challenge: challenge,
    scope: SCOPES
  });

  window.location.href =
    "https://accounts.spotify.com/authorize?" +
    params.toString();
}

async function handleCallback() {

  const params = new URLSearchParams(window.location.search);

  const code = params.get("code");

  if (!code) return;

  const verifier = localStorage.getItem("pkce_verifier");

  if (!verifier) {
    document.getElementById("result").textContent =
      "PKCE verifier missing.";
    return;
  }

  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: "authorization_code",
    code: code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });

  const response = await fetch(
    "https://accounts.spotify.com/api/token",
    {
      method: "POST",
      headers: {
        "Content-Type":
          "application/x-www-form-urlencoded"
      },
      body: body.toString()
    }
  );

  const data = await response.json();

  if (!response.ok) {
    document.getElementById("result").textContent =
      "Spotify error: " + JSON.stringify(data);

    return;
  }

  localStorage.setItem(
    "spotify_access_token",
    data.access_token
  );

  localStorage.setItem(
    "spotify_refresh_token",
    data.refresh_token || ""
  );

  document.getElementById("result").textContent =
    "✅ Spotify connected!";
}

document
  .getElementById("login")
  .addEventListener("click", startLogin);

handleCallback();
</script>

</body>
</html>
