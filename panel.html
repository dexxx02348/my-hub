<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #202124;
      color: #e8eaed;
      font-family: Arial, Roboto, sans-serif;
    }

    body {
      padding: 10px;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       CARDS
    ========================= */

    .card {
      background: #292a2d;
      border: 1px solid #3c4043;
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 10px;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 7px;
    }

    .settings-button {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #9aa0a6;
      font-size: 15px;
    }

    .settings-button:hover {
      background: #35363a;
      color: #e8eaed;
    }

    /* =========================
       TEXT
    ========================= */

    .section {
      color: #9aa0a6;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .65px;
      margin-bottom: 9px;
    }

    .status {
      color: #9aa0a6;
      font-size: 10px;
      margin-top: 7px;
      min-height: 14px;
      line-height: 1.4;
    }

    /* =========================
       SPOTIFY
    ========================= */

    .player-card {
      position: relative;
    }

    .song {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .art-wrap {
      position: relative;
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }

    .art {
      width: 64px;
      height: 64px;
      display: block;
      border-radius: 8px;
      background: #3c4043;
      object-fit: cover;
    }

    .song-info {
      min-width: 0;
      flex: 1;
    }

    .song-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist {
      color: #9aa0a6;
      font-size: 11px;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-area {
      margin-top: 10px;
    }

    .range {
      width: 100%;
      accent-color: #8ab4f8;
      cursor: pointer;
    }

    .times {
      display: flex;
      justify-content: space-between;
      color: #9aa0a6;
      font-size: 9px;
      margin-top: -1px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 8px;
    }

    .control {
      min-width: 34px;
      height: 32px;
      padding: 0 8px;
      border: 0;
      border-radius: 8px;
      background: #35363a;
      color: #e8eaed;
      transition: background .12s, transform .08s;
    }

    .control:hover {
      background: #45464a;
    }

    .control:active {
      transform: scale(.94);
    }

    .play {
      min-width: 48px;
      background: #8ab4f8;
      color: #202124;
      font-weight: 600;
    }

    .play:hover {
      background: #a8c7fa;
    }

    .volume {
      margin-top: 8px;
    }

    .device {
      color: #80868b;
      font-size: 9px;
      margin-top: 6px;
      text-align: center;
    }

    /* =========================
       MICRO HOVER
    ========================= */

    .micro-overlay {
      position: absolute;
      inset: 0;
      border-radius: 8px;
      background: rgba(0, 0, 0, .50);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      opacity: 0;
      transition: opacity .15s ease;
    }

    .art-wrap:hover .micro-overlay {
      opacity: 1;
    }

    .micro-control {
      width: 23px;
      height: 23px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(32, 33, 36, .84);
      color: white;
      font-size: 10px;
    }

    .micro-control:hover {
      background: rgba(70, 72, 76, .95);
    }

    .micro-settings {
      position: absolute;
      right: 3px;
      bottom: 3px;
      z-index: 3;
      width: 19px;
      height: 19px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(32, 33, 36, .84);
      color: #d4d7da;
      font-size: 10px;
      opacity: .85;
    }

    .micro-settings:hover {
      opacity: 1;
      background: rgba(53, 54, 58, .95);
    }

    /* =========================
       QUICK LINKS
    ========================= */

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .link {
      width: 100%;
      height: 35px;
      padding: 0 10px;
      border: 1px solid #3c4043;
      border-radius: 8px;
      background: #292a2d;
      color: #e8eaed;
      text-align: left;
    }

    .link:hover {
      background: #35363a;
    }

    /* =========================
       GAMES
    ========================= */

    .game-area {
      margin-top: 9px;
    }

    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .game-title {
      font-size: 13px;
      font-weight: 500;
    }

    .back {
      height: 28px;
      font-size: 10px;
    }

    .game-button {
      width: 100%;
      height: 105px;
      font-size: 20px;
    }

    .game-center {
      text-align: center;
      padding: 12px;
    }

    .score {
      font-size: 28px;
      margin: 10px 0;
    }

    .guess-input {
      width: 100%;
      height: 34px;
      padding: 0 9px;
      border: 1px solid #3c4043;
      border-radius: 8px;
      background: #202124;
      color: #e8eaed;
      outline: none;
    }

    .guess-input:focus {
      border-color: #8ab4f8;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 280px;
      height: auto;
      margin: 0 auto;
      border: 1px solid #3c4043;
      border-radius: 9px;
      background: #202124;
    }

    /* =========================
       SETTINGS
    ========================= */

    .settings-panel {
      position: absolute;
      top: 44px;
      right: 10px;
      width: 245px;
      padding: 13px;
      background: #292a2d;
      border: 1px solid #4a4d50;
      border-radius: 11px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, .35);
      z-index: 100;
    }

    .settings-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .setting-label {
      color: #9aa0a6;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 7px;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      margin-bottom: 13px;
    }

    .mode-button {
      height: 32px;
      border: 1px solid #3c4043;
      border-radius: 7px;
      background: #202124;
      color: #e8eaed;
      font-size: 11px;
    }

    .mode-button:hover {
      background: #35363a;
    }

    .mode-button.active {
      border-color: #8ab4f8;
      background: #303b4c;
      color: #a8c7fa;
    }

    .setting-row {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #e8eaed;
      font-size: 11px;
    }

    .device-label {
      color: #9aa0a6;
      font-size: 10px;
      margin-top: 9px;
      margin-bottom: 5px;
    }

    .device-select {
      width: 100%;
      height: 32px;
      padding: 0 8px;
      border: 1px solid #3c4043;
      border-radius: 7px;
      background: #202124;
      color: #e8eaed;
      outline: none;
    }

    .device-select:focus {
      border-color: #8ab4f8;
    }

    .refresh-devices {
      width: 100%;
      height: 30px;
      margin-top: 6px;
      font-size: 10px;
    }

    .disconnect {
      width: 100%;
      height: 32px;
      margin-top: 9px;
      background: #35363a;
      color: #e8eaed;
      font-size: 11px;
    }

    /* =========================
       SWITCHES
    ========================= */

    .switch {
      position: relative;
      width: 34px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: #45464a;
      cursor: pointer;
    }

    .slider:before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #9aa0a6;
      transition: .15s;
    }

    .switch input:checked + .slider {
      background: #6d93c5;
    }

    .switch input:checked + .slider:before {
      transform: translateX(14px);
      background: #e8eaed;
    }

    /* =========================
       MICRO MODE
    ========================= */

    body.micro-mode {
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    body.micro-mode .topbar {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 50;
      width: 25px;
      height: 25px;
      margin: 0;
    }

    body.micro-mode .settings-button {
      width: 22px;
      height: 22px;
      font-size: 12px;
    }

    body.micro-mode .player-card {
      padding: 0;
      margin: 0;
      background: transparent;
      border: 0;
    }

    body.micro-mode .section,
    body.micro-mode .song-info,
    body.micro-mode .progress-area,
    body.micro-mode .controls,
    body.micro-mode .volume,
    body.micro-mode .device,
    body.micro-mode #connectStatus {
      display: none;
    }

    body.micro-mode .song {
      display: block;
    }

    body.micro-mode .art-wrap,
    body.micro-mode .art {
      width: 100%;
      height: 100%;
      border-radius: 9px;
    }

    body.micro-mode .micro-settings {
      display: none;
    }

    body.micro-mode .settings-panel {
      top: 27px;
      right: 3px;
    }

    /* =========================
       MINI MODE
    ========================= */

    body.mini-mode {
      padding: 7px;
      background: transparent;
    }

    body.mini-mode .quick-section,
    body.mini-mode .games-section,
    body.mini-mode .progress-area,
    body.mini-mode .volume,
    body.mini-mode .device,
    body.mini-mode .settings-button,
    body.mini-mode .section,
    body.mini-mode #connectStatus {
      display: none;
    }

    body.mini-mode .player-card {
      padding: 7px;
      margin: 0;
    }

    body.mini-mode .song-info {
      display: none;
    }

    body.mini-mode .song {
      display: block;
    }

    body.mini-mode .art-wrap,
    body.mini-mode .art {
      width: 105px;
      height: 105px;
    }

    body.mini-mode .micro-overlay {
      display: none;
    }

    body.mini-mode .controls {
      display: flex;
    }

    /* =========================
       JUMBO MODE
    ========================= */

    body.jumbo-mode {
      padding: 15px;
    }

    body.jumbo-mode .player-card {
      padding: 17px;
    }

    body.jumbo-mode .art-wrap,
    body.jumbo-mode .art {
      width: 145px;
      height: 145px;
    }

    body.jumbo-mode .song {
      gap: 16px;
    }

    body.jumbo-mode .song-name {
      font-size: 18px;
    }

    body.jumbo-mode .artist {
      font-size: 13px;
    }

    body.jumbo-mode .control {
      height: 39px;
      min-width: 41px;
    }

    body.jumbo-mode .play {
      min-width: 60px;
    }

  </style>
</head>

<body>

  <!-- TOP BAR -->
  <div class="topbar">

    <button
      id="settingsButton"
      class="settings-button"
      title="Settings"
    >
      ⚙
    </button>

  </div>


  <!-- SETTINGS -->
  <div
    id="settingsPanel"
    class="settings-panel hidden"
  >

    <div class="settings-title">
      My Hub Settings
    </div>

    <div class="setting-label">
      Display mode
    </div>

    <div class="mode-grid">

      <button
        class="mode-button"
        data-mode="micro"
      >
        Micro
      </button>

      <button
        class="mode-button"
        data-mode="mini"
      >
        Mini
      </button>

      <button
        class="mode-button"
        data-mode="normal"
      >
        Normal
      </button>

      <button
        class="mode-button"
        data-mode="jumbo"
      >
        Jumbo
      </button>

    </div>


    <div class="setting-row">

      <span>Quick links</span>

      <label class="switch">

        <input
          id="linksToggle"
          type="checkbox"
          checked
        >

        <span class="slider"></span>

      </label>

    </div>


    <div class="setting-row">

      <span>Mini games</span>

      <label class="switch">

        <input
          id="gamesToggle"
          type="checkbox"
          checked
        >

        <span class="slider"></span>

      </label>

    </div>


    <div class="device-label">
      Spotify device
    </div>

    <select
      id="deviceSelect"
      class="device-select"
    >
      <option value="">
        Active device
      </option>
    </select>

    <button
      id="refreshDevices"
      class="refresh-devices"
    >
      Refresh devices
    </button>


    <button
      id="disconnect"
      class="disconnect"
    >
      Reconnect Spotify
    </button>

  </div>


  <!-- SPOTIFY -->
  <div class="card player-card">

    <div class="section">
      Spotify
    </div>


    <div class="song">

      <div class="art-wrap">

        <img
          id="art"
          class="art"
          alt=""
        >


        <div class="micro-overlay">

          <button
            id="microPrev"
            class="micro-control"
            title="Previous"
          >
            ⏮
          </button>

          <button
            id="microPlay"
            class="micro-control"
            title="Play / Pause"
          >
            ▶
          </button>

          <button
            id="microNext"
            class="micro-control"
            title="Next"
          >
            ⏭
          </button>

        </div>


        <button
          id="microSettings"
          class="micro-settings"
          title="Settings"
        >
          ⚙
        </button>

      </div>


      <div class="song-info">

        <div
          id="song"
          class="song-name"
        >
          Nothing playing
        </div>

        <div
          id="artist"
          class="artist"
        >
          Spotify
        </div>

      </div>

    </div>


    <div
      id="connectStatus"
      class="status"
    >
      Checking Spotify...
    </div>


    <div id="playerControls">

      <div class="progress-area">

        <input
          id="progress"
          class="range"
          type="range"
          min="0"
          max="1000"
          value="0"
        >

        <div class="times">

          <span id="current">
            0:00
          </span>

          <span id="duration">
            0:00
          </span>

        </div>

      </div>


      <div class="controls">

        <button
          id="shuffle"
          class="control"
          title="Shuffle"
        >
          🔀
        </button>

        <button
          id="previous"
          class="control"
          title="Previous"
        >
          ⏮
        </button>

        <button
          id="play"
          class="control play"
          title="Play / Pause"
        >
          ▶
        </button>

        <button
          id="next"
          class="control"
          title="Next"
        >
          ⏭
        </button>

        <button
          id="repeat"
          class="control"
          title="Repeat"
        >
          🔁
        </button>

      </div>


      <div class="volume">

        <input
          id="volume"
          class="range"
          type="range"
          min="0"
          max="100"
          value="50"
        >

      </div>


      <div
        id="device"
        class="device"
      >
        Spotify
      </div>

    </div>

  </div>


  <!-- QUICK LINKS -->
  <div
    id="quickSection"
    class="card quick-section"
  >

    <div class="section">
      Quick Links
    </div>

    <div class="grid">

      <button
        class="link"
        data-url="https://www.google.com"
      >
        Google
      </button>

      <button
        class="link"
        data-url="https://www.youtube.com"
      >
        YouTube
      </button>

      <button
        class="link"
        data-url="https://drive.google.com"
      >
        Google Drive
      </button>

      <button
        class="link"
        data-url="https://github.com"
      >
        GitHub
      </button>

    </div>

  </div>


  <!-- GAMES -->
  <div
    id="gamesSection"
    class="card games-section"
  >

    <div class="section">
      Mini Games
    </div>

    <div
      id="gameMenu"
      class="grid"
    >

      <button id="clicker">
        🖱 Clicker
      </button>

      <button id="guess">
        🔢 Number Guess
      </button>

      <button id="reaction">
        ⚡ Reaction
      </button>

      <button id="snake">
        🐍 Snake
      </button>

    </div>

    <div
      id="gameArea"
      class="game-area hidden"
    ></div>

  </div>


  <script>

    /* =====================================================
       CONFIG
    ===================================================== */

    const CLIENT_ID =
      "d3445d44d1314d07b1d7a7904bbe5a48";

    const AUTH_URL =
      "https://dexxx02348.github.io/my-hub/auth.html";

    const TRUSTED_ORIGIN =
      "https://dexxx02348.github.io";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const art =
      document.getElementById("art");

    const song =
      document.getElementById("song");

    const artist =
      document.getElementById("artist");

    const progress =
      document.getElementById("progress");

    const current =
      document.getElementById("current");

    const duration =
      document.getElementById("duration");

    const play =
      document.getElementById("play");

    const volume =
      document.getElementById("volume");

    const device =
      document.getElementById("device");

    const status =
      document.getElementById("connectStatus");

    const settingsPanel =
      document.getElementById("settingsPanel");

    const deviceSelect =
      document.getElementById("deviceSelect");


    /* =====================================================
       MODES
    ===================================================== */

    const validModes = [
      "micro",
      "mini",
      "normal",
      "jumbo"
    ];

    let mode =
      localStorage.getItem("myhub_mode") ||
      "normal";


    function sendModeToParent(selectedMode) {

      if (
        window.parent &&
        window.parent !== window
      ) {

        window.parent.postMessage(
          {
            type: "myhub-resize",
            mode: selectedMode
          },
          TRUSTED_ORIGIN
        );

      }

    }


    function applyMode(selectedMode) {

      if (
        !validModes.includes(
          selectedMode
        )
      ) {

        selectedMode =
          "normal";

      }


      mode =
        selectedMode;


      document.body.classList.remove(
        "micro-mode",
        "mini-mode",
        "jumbo-mode"
      );


      if (
        selectedMode !==
        "normal"
      ) {

        document.body.classList.add(
          selectedMode + "-mode"
        );

      }


      document
        .querySelectorAll(
          ".mode-button"
        )
        .forEach(
          button => {

            button.classList.toggle(
              "active",
              button.dataset.mode ===
                selectedMode
            );

          }
        );


      localStorage.setItem(
        "myhub_mode",
        selectedMode
      );


      sendModeToParent(
        selectedMode
      );

    }


    document
      .querySelectorAll(
        ".mode-button"
      )
      .forEach(
        button => {

          button.onclick =
            () => {

              applyMode(
                button.dataset.mode
              );

            };

        }
      );


    /* =====================================================
       SETTINGS
    ===================================================== */

    document.getElementById(
      "settingsButton"
    ).onclick =
      event => {

        event.stopPropagation();

        settingsPanel.classList.toggle(
          "hidden"
        );

      };


    document.getElementById(
      "microSettings"
    ).onclick =
      event => {

        event.stopPropagation();

        settingsPanel.classList.toggle(
          "hidden"
        );

      };


    document.addEventListener(
      "click",
      event => {

        if (
          settingsPanel.classList.contains(
            "hidden"
          )
        ) {
          return;
        }


        if (
          settingsPanel.contains(
            event.target
          )
        ) {
          return;
        }


        if (
          event.target.id ===
          "settingsButton"
        ) {
          return;
        }


        settingsPanel.classList.add(
          "hidden"
        );

      }
    );


    /* =====================================================
       VISIBILITY SETTINGS
    ===================================================== */

    const linksToggle =
      document.getElementById(
        "linksToggle"
      );

    const gamesToggle =
      document.getElementById(
        "gamesToggle"
      );


    linksToggle.checked =
      localStorage.getItem(
        "myhub_links"
      ) !== "false";


    gamesToggle.checked =
      localStorage.getItem(
        "myhub_games"
      ) !== "false";


    function updateVisibility() {

      document.getElementById(
        "quickSection"
      ).classList.toggle(
        "hidden",
        !linksToggle.checked
      );


      document.getElementById(
        "gamesSection"
      ).classList.toggle(
        "hidden",
        !gamesToggle.checked
      );

    }


    linksToggle.onchange =
      () => {

        localStorage.setItem(
          "myhub_links",
          String(
            linksToggle.checked
          )
        );

        updateVisibility();

      };


    gamesToggle.onchange =
      () => {

        localStorage.setItem(
          "myhub_games",
          String(
            gamesToggle.checked
          )
        );

        updateVisibility();

      };


    updateVisibility();


    /* =====================================================
       SPOTIFY POPUP LOGIN
    ===================================================== */

    document.getElementById(
      "disconnect"
    ).onclick =
      () => {

        localStorage.removeItem(
          "spotify_access_token"
        );

        localStorage.removeItem(
          "spotify_refresh_token"
        );

        localStorage.removeItem(
          "spotify_expires_at"
        );


        window.open(
          AUTH_URL,
          "myhubSpotifyAuth",
          "width=500,height=700"
        );

      };


    window.addEventListener(
      "message",
      async event => {

        if (
          event.origin !==
          TRUSTED_ORIGIN
        ) {
          return;
        }


        if (
          event.data?.type !==
          "myhub-spotify-connected"
        ) {
          return;
        }


        if (
          !event.data.access_token
        ) {
          return;
        }


        localStorage.setItem(
          "spotify_access_token",
          event.data.access_token
        );


        if (
          event.data.refresh_token
        ) {

          localStorage.setItem(
            "spotify_refresh_token",
            event.data.refresh_token
          );

        }


        localStorage.setItem(
          "spotify_expires_at",
          String(

        );


        status.textContent =
          "Spotify connected";


        await updatePlayback();

        await loadDevices();

    /* =====================================================
       TOKEN REFRESH
    ===================================================== */

    async function refreshToken() {

      const refresh =
        localStorage.getItem(
          "spotify_refresh_token"
        );


      if (!refresh) {

        throw new Error(
          "Spotify is not connected."
        );

      }


      const body =
        new URLSearchParams({

          grant_type:
            "refresh_token",

          refresh_token:
            refresh,

          client_id:
            CLIENT_ID

        });


      const response =
        await fetch(
          "https://accounts.spotify.com/api/token",
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/x-www-form-urlencoded"

            },

            body:
              body.toString()

          }
        );


      const text =
        await response.text();


      let data = null;


      try {

        data =
          text
            ? JSON.parse(text)
            : null;

      } catch {

        throw new Error(
          "Spotify returned an invalid token response."
        );

      }


      if (!response.ok) {

        localStorage.removeItem(
          "spotify_access_token"
        );

        localStorage.removeItem(
          "spotify_refresh_token"
        );

        localStorage.removeItem(
          "spotify_expires_at"
        );


        throw new Error(
          data?.error_description ||
          data?.error ||
          "Spotify login expired."
        );

      }


      if (
        !data?.access_token
      ) {

        throw new Error(
          "Spotify did not return an access token."
        );

      }


      localStorage.setItem(
        "spotify_access_token",
        data.access_token
      );


      if (
        data.refresh_token
      ) {

        localStorage.setItem(
          "spotify_refresh_token",
          data.refresh_token
        );

      }


      localStorage.setItem(
        "spotify_expires_at",
        String(
          Date.now() +
          data.expires_in * 1000
        )
      );


      return data.access_token;

    }


    /* =====================================================
       TOKEN
    ===================================================== */

    async function getToken() {

      const token =
        localStorage.getItem(
          "spotify_access_token"
        );


      const expires =
        Number(
          localStorage.getItem(
            "spotify_expires_at"
          ) || 0
        );


      if (
        token &&
        Date.now() <
          expires - 60000
      ) {

        return token;

      }


      return refreshToken();

    }


    /* =====================================================
       SPOTIFY REQUEST
    ===================================================== */

    async function spotify(
      endpoint,
      options = {},
      retry = true
    ) {

      let token =
        await getToken();


      let response;


      try {

        response =
          await fetch(
            "https://api.spotify.com/v1" +
            endpoint,
            {

              ...options,

              headers: {

                ...(options.headers || {}),

                Authorization:
                  "Bearer " +
                  token

              }

            }
          );

      } catch {

        throw new Error(
          "Could not reach Spotify."
        );

      }


      if (
        response.status === 401 &&
        retry
      ) {

        token =
          await refreshToken();


        return spotify(
          endpoint,
          {
            ...options,
            headers: {
              ...(options.headers || {})
            }
          },
          false
        );

      }


      if (
        response.status === 204
      ) {

        return null;

      }


      const text =
        await response.text();


      if (
        response.ok &&
        !text
      ) {

        return null;

      }


      let data = null;


      if (text) {

        try {

          data =
            JSON.parse(text);

        } catch {

          throw new Error(
            "Spotify returned an unexpected response."
          );

        }

      }


      if (!response.ok) {

        const message =
          data?.error?.message ||
          data?.error?.reason ||
          null;


        if (
          response.status === 403
        ) {

          throw new Error(
            message
              ? "Spotify 403: " + message
              : "Spotify denied this playback command. Check Premium status and the selected device."
          );

        }


        throw new Error(
          message ||
          "Spotify error " +
          response.status
        );

      }


      return data;

    }

    async function loadDevices() {

        const active =
          document.createElement(
            "option"
          );

        active.value = "";

          active
        );


        for (
          const currentDevice

            document.createElement(
              "option"
            );

          option.value =
            currentDevice.id;

          option.textContent =
            currentDevice.name +
            (

            );


          if (
            currentDevice.id ===
            selectedDeviceId
          ) {

            option.selected =
              true;

          }


          deviceSelect.appendChild(
            option
          );

        }


        if (
          selectedDeviceId &&
          !data.devices.some(
            d =>
              d.id ===
              selectedDeviceId
          )
        ) {

          selectedDeviceId =
            "";

          localStorage.removeItem(
            "myhub_device_id"

        status.textContent =
          error.message;

    /* =====================================================
       TIME
    ===================================================== */

    function formatTime(ms) {

      const totalSeconds =
        Math.floor(
          ms / 1000
        );


      const minutes =
        Math.floor(
          totalSeconds / 60
        );


      const seconds =
        String(
          totalSeconds % 60
        ).padStart(
          2,
          "0"
        );


      return (
        minutes +
        ":" +
        seconds
      );

    }


    /* =====================================================
       PLAYBACK
    ===================================================== */

    let playback = null;

    let updateInProgress = false;


    async function updatePlayback() {

      if (
        updateInProgress
      ) {

        return;

      }


      updateInProgress =
        true;


      try {

        playback =
          await spotify(
            "/me/player"
          );


        if (
          !playback ||
          !playback.item
        ) {

          song.textContent =
            "Nothing playing";


          artist.textContent =
            "Open Spotify and play something";


          art.removeAttribute(
            "src"
          );


          play.textContent =
            "▶";


          document.getElementById(
            "microPlay"
          ).textContent =
            "▶";


          device.textContent =
            "Spotify";


          status.textContent =
            "Connected";

          return;

        }


        const item =
          playback.item;


        song.textContent =
          item.name ||
          "Unknown";


        artist.textContent =
          (item.artists || [])
            .map(
              a => a.name
            )
            .join(", ") ||
          "Unknown artist";


        const image =
          item.album?.images?.[1]?.url ||
          item.album?.images?.[0]?.url;


        if (
          image
        ) {

          art.src =
            image;

        }


        const total =
          item.duration_ms ||
          0;


        const position =
          playback.progress_ms ||
          0;


        progress.value =
          total
            ? (
                position /
                total
              ) * 1000
            : 0;


        current.textContent =
          formatTime(
            position
          );


        duration.textContent =
          formatTime(
            total
          );


        const playing =
          !!playback.is_playing;


        play.textContent =
          playing
            ? "⏸"
            : "▶";


        document.getElementById(
          "microPlay"
        ).textContent =
          playing
            ? "⏸"
            : "▶";


        if (
          playback.device
        ) {

          device.textContent =
            "Playing on " +
            playback.device.name;

        } else {

          device.textContent =
            "Spotify";

        }


        status.textContent =
          "Connected";


      } catch (error) {

        status.textContent =
          error.message;

      } finally {

        updateInProgress =
          false;

      }

    }

    /* Snake */

    document.getElementById(

        showGame(`

              color:#9aa0a6;
              font-size:10px;
              margin-bottom:7px;
            "
          >
            Use the arrow keys
          </div>

          <canvas
            id="snakeCanvas"
            width="280"
            height="280"
          ></canvas>

          <div
            id="snakeScore"
            class="status"
            style="text-align:center"
          >
            Score: 0
          </div>
        `);


        document.getElementById(
          "backGames"
        ).onclick =
          returnToGames;


        const canvas =
          document.getElementById(
            "snakeCanvas"
          );


        const ctx =
          canvas.getContext(
            "2d"
          );


        const cell =
          14;


        const size =
          20;


        let snakeBody = [

          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 }

        ];


        let dx =
          1;


        let dy =
          0;


        let score =
          0;


        let running =
          true;


        let food = {

          x:
            Math.floor(
              Math.random() *
              size
            ),

          y:
            Math.floor(
              Math.random() *
              size
            )

        };


        function draw() {

          ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
          );


          ctx.fillStyle =
            "#8ab4f8";


          snakeBody.forEach(
            part => {

              ctx.fillRect(

                part.x *
                  cell,

                part.y *
                  cell,

                cell - 1,

                cell - 1

              );

            }
          );


          ctx.fillStyle =
            "#e8eaed";


          ctx.fillRect(

            food.x *
              cell,

            food.y *
              cell,

            cell - 1,

            cell - 1

          );

        }


        function tick() {

          if (!running) {
            return;
          }


          const head = {

            x:
              snakeBody[0].x +
              dx,

            y:
              snakeBody[0].y +
              dy

          };


          if (

            head.x < 0 ||
            head.x >= size ||
            head.y < 0 ||
            head.y >= size ||

            snakeBody.some(
              part =>
                part.x === head.x &&
                part.y === head.y
            )

          ) {

            running =
              false;


            document.getElementById(
              "snakeScore"
            ).textContent =
              "Game over — Score: " +
              score;


            return;

          }


          snakeBody.unshift(
            head
          );


          if (

            head.x === food.x &&
            head.y === food.y

          ) {

            score++;


            document.getElementById(
              "snakeScore"
            ).textContent =
              "Score: " +
              score;


            do {

              food = {

                x:
                  Math.floor(
                    Math.random() *
                    size
                  ),

                y:
                  Math.floor(
                    Math.random() *
                    size
                  )

              };


            } while (

              snakeBody.some(
                part =>
                  part.x === food.x &&
                  part.y === food.y
              )

            );


          } else {

            snakeBody.pop();

          }


          draw();


          setTimeout(
            tick,
            120
          );

        }


        window.onkeydown =
          event => {

            if (
              event.key === "ArrowUp" &&
              dy !== 1
            ) {

              dx = 0;
              dy = -1;

            }


            if (
              event.key === "ArrowDown" &&
              dy !== -1
            ) {

              dx = 0;
              dy = 1;

            }


            if (
              event.key === "ArrowLeft" &&
              dx !== 1
            ) {

              dx = -1;
              dy = 0;

            }


            if (
              event.key === "ArrowRight" &&
              dx !== -1
            ) {

              dx = 1;
              dy = 0;

            }

          };


        draw();

        tick();

      };


    /* =====================================================
       INITIALIZE
    ===================================================== */

    applyMode(
      mode
    );

    updateVisibility();


    const existingToken =
      localStorage.getItem(
        "spotify_access_token"
      );


    if (existingToken) {

      status.textContent =
        "Connected";


      updatePlayback();

      loadDevices();

    } else {

      status.textContent =
        "Not connected — use Settings.";

    }

  </script>

</body>
</html>
