<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Hub</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  padding: 10px;
  background: #202124;
  color: #e8eaed;
  font-family: Arial, Roboto, sans-serif;
  overflow: auto;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}


/* =========================================
   TOP BAR
========================================= */

.topbar {
  height: 28px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  margin-bottom: 6px;
}

.settings-button {
  width: 27px;
  height: 27px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #9aa0a6;
  font-size: 14px;
}

.settings-button:hover {
  background: #35363a;
  color: #e8eaed;
}


/* =========================================
   CARDS
========================================= */

.card {
  width: 100%;
  background: #292a2d;
  border: 1px solid #3c4043;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 9px;
}

.section {
  color: #9aa0a6;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .6px;
  margin-bottom: 9px;
}

.status {
  color: #9aa0a6;
  font-size: 10px;
  line-height: 1.4;
  margin-top: 7px;
}


/* =========================================
   SPOTIFY PLAYER
========================================= */

.player-card {
  position: relative;
}

.song {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.art-wrap {
  position: relative;
  width: 64px;
  height: 64px;
  min-width: 64px;
  flex: 0 0 64px;
}

.art {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 8px;
  background: #3c4043;
  object-fit: cover;
}

.song-info {
  flex: 1 1 auto;
  min-width: 0;
}

.song-name {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artist {
  color: #9aa0a6;
  font-size: 11px;
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


/* =========================================
   PROGRESS
========================================= */

.progress-area {
  margin-top: 10px;
}

.range {
  display: block;
  width: 100%;
  margin: 0;
  accent-color: #8ab4f8;
}

.times {
  display: flex;
  justify-content: space-between;
  color: #9aa0a6;
  font-size: 9px;
  margin-top: 2px;
}


/* =========================================
   CONTROLS
========================================= */

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.control {
  min-width: 34px;
  height: 32px;
  padding: 0 8px;
  border: 0;
  border-radius: 8px;
  background: #35363a;
  color: #e8eaed;
}

.control:hover {
  background: #45464a;
}

.play {
  min-width: 48px;
  background: #8ab4f8;
  color: #202124;
  font-weight: 600;
}

.play:hover {
  background: #a8c7fa;
}

.volume {
  margin-top: 8px;
}

.device {
  color: #80868b;
  font-size: 9px;
  margin-top: 6px;
  text-align: center;
}


/* =========================================
   MICRO HOVER
========================================= */

.micro-overlay {
  position: absolute;
  inset: 0;
  border-radius: 8px;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;

  background: rgba(0, 0, 0, .48);

  opacity: 0;
  pointer-events: none;

  transition: opacity .14s ease;
}

.art-wrap:hover .micro-overlay {
  opacity: 1;
  pointer-events: auto;
}

.micro-control {
  width: 23px;
  height: 23px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgba(25, 26, 28, .88);
  color: #fff;
  font-size: 10px;
}

.micro-control:hover {
  background: rgba(66, 68, 72, .96);
}

.micro-settings {
  position: absolute;
  right: 3px;
  bottom: 3px;

  width: 19px;
  height: 19px;

  padding: 0;
  border: 0;
  border-radius: 50%;

  background: rgba(25, 26, 28, .86);
  color: #d4d7da;

  font-size: 10px;
}


/* =========================================
   RECORD PLAYER
========================================= */

.record-wrap {
  display: none;
  position: relative;
  width: 190px;
  height: 190px;
  flex: 0 0 190px;
  align-items: center;
  justify-content: center;
}

.record {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;

  background:
    repeating-radial-gradient(
      circle at center,
      #090909 0px,
      #161616 3px,
      #080808 6px
    );

  box-shadow:
    inset 0 0 0 2px #252525,
    0 7px 20px rgba(0,0,0,.42);

  overflow: hidden;
}

.record::before {
  content: "";
  position: absolute;
  inset: 8%;
  border-radius: 50%;

  background:
    repeating-radial-gradient(
      circle at center,
      transparent 0,
      transparent 4px,
      rgba(255,255,255,.035) 5px,
      transparent 6px
    );
}

.record-label {
  position: absolute;
  top: 27.5%;
  left: 27.5%;

  width: 45%;
  height: 45%;

  border-radius: 50%;

  background: #4a4a4a center/cover no-repeat;

  box-shadow:
    inset 0 0 0 3px rgba(0,0,0,.16);
}

.record-hole {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 11px;
  height: 11px;

  margin-left: -5.5px;
  margin-top: -5.5px;

  border-radius: 50%;
  background: #111;
  box-shadow:
    inset 0 0 0 2px #444;
}

.record-playing {
  animation: recordSpin 3s linear infinite;
}

@keyframes recordSpin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

body.record-style .art-wrap {
  display: none;
}

body.record-style .record-wrap {
  display: flex;
}


/* =========================================
   SETTINGS
========================================= */

.settings-panel {
  position: fixed;
  top: 41px;
  right: 10px;

  width: min(240px, calc(100vw - 20px));

  padding: 13px;

  background: #292a2d;
  border: 1px solid #4a4d50;
  border-radius: 11px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.35);

  z-index: 1000;
}

.settings-title {
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 12px;
}

.setting-label {
  color: #9aa0a6;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 7px;
}

.mode-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  margin-bottom: 13px;
}

.mode-button,
.style-button {
  height: 32px;

  border: 1px solid #3c4043;
  border-radius: 7px;

  background: #202124;
  color: #e8eaed;

  font-size: 11px;
}

.mode-button:hover,
.style-button:hover {
  background: #35363a;
}

.mode-button.active,
.style-button.active {
  background: #303b4c;
  border-color: #8ab4f8;
  color: #a8c7fa;
}

.style-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  margin-bottom: 10px;
}


/* =========================================
   SWITCHES
========================================= */

.setting-row {
  min-height: 34px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  color: #e8eaed;
  font-size: 11px;
}

.switch {
  position: relative;
  width: 34px;
  height: 20px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  inset: 0;

  border-radius: 20px;

  background: #45464a;

  cursor: pointer;
}

.slider::before {
  content: "";

  position: absolute;

  width: 14px;
  height: 14px;

  left: 3px;
  top: 3px;

  border-radius: 50%;

  background: #9aa0a6;

  transition: .15s;
}

.switch input:checked + .slider {
  background: #6d93c5;
}

.switch input:checked + .slider::before {
  transform: translateX(14px);
  background: #e8eaed;
}


/* =========================================
   QUICK LINKS
========================================= */

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
}

.link {
  width: 100%;
  min-width: 0;
  height: 35px;

  padding: 0 10px;

  border: 1px solid #3c4043;
  border-radius: 8px;

  background: #292a2d;
  color: #e8eaed;

  text-align: left;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.link:hover {
  background: #35363a;
}


/* =========================================
   GAMES
========================================= */

.game-area {
  margin-top: 8px;
}

.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.game-title {
  font-size: 13px;
  font-weight: 500;
}

.back {
  height: 28px;
  font-size: 10px;
}

.game-button {
  width: 100%;
  height: 105px;
  font-size: 20px;
}

.game-center {
  text-align: center;
  padding: 12px;
}

.score {
  font-size: 28px;
  margin: 10px 0;
}

.guess-input {
  width: 100%;
  height: 34px;

  padding: 0 9px;

  border: 1px solid #3c4043;
  border-radius: 8px;

  background: #202124;
  color: #e8eaed;

  outline: none;
}

.guess-input:focus {
  border-color: #8ab4f8;
}

canvas {
  display: block;
  width: 100%;
  max-width: 280px;
  height: auto;

  margin: 0 auto;

  border: 1px solid #3c4043;
  border-radius: 9px;

  background: #202124;
}


/* =========================================
   MICRO
========================================= */

body.micro-mode {
  width: 100%;
  height: 100%;
  padding: 0;
  overflow: hidden;
  background: transparent;
}

body.micro-mode .topbar {
  position: fixed;
  top: 3px;
  right: 3px;
  width: 22px;
  height: 22px;
  margin: 0;
  z-index: 500;
}

body.micro-mode .settings-button {
  width: 21px;
  height: 21px;
  font-size: 10px;
  background: rgba(32,33,36,.76);
}

body.micro-mode .player-card {
  width: 100%;
  height: 100%;
  padding: 0;
  margin: 0;
  background: transparent;
  border: 0;
}

body.micro-mode .player-card > .section,
body.micro-mode .song-info,
body.micro-mode .progress-area,
body.micro-mode .controls,
body.micro-mode .volume,
body.micro-mode .device,
body.micro-mode #connectStatus {
  display: none;
}

body.micro-mode .song {
  width: 100%;
  height: 100%;
  display: block;
}

body.micro-mode .art-wrap,
body.micro-mode .art {
  width: 100%;
  height: 100%;
  min-width: 0;
  border-radius: 9px;
}

body.micro-mode .art {
  object-fit: cover;
}

body.micro-mode .micro-settings {
  display: none;
}

body.micro-mode .record-wrap {
  width: 100%;
  height: 100%;
}

body.micro-mode .record {
  width: min(100%, 100%);
  height: auto;
  aspect-ratio: 1 / 1;
}

body.micro-mode .settings-panel {
  top: 27px;
  right: 3px;
}


/* =========================================
   MINI
========================================= */

body.mini-mode {
  padding: 7px;
  overflow: auto;
}

body.mini-mode .quick-section,
body.mini-mode .games-section {
  display: none;
}

body.mini-mode .player-card {
  padding: 7px;
  margin: 0;
}

body.mini-mode .section,
body.mini-mode .song-info,
body.mini-mode .progress-area,
body.mini-mode .volume,
body.mini-mode .device,
body.mini-mode #connectStatus,
body.mini-mode .settings-button {
  display: none;
}

body.mini-mode .song {
  display: block;
}

body.mini-mode .art-wrap,
body.mini-mode .art {
  width: 100%;
  height: auto;
  aspect-ratio: 1 / 1;
}

body.mini-mode .micro-overlay {
  display: flex;
}

body.mini-mode .micro-settings {
  display: block;
}

body.mini-mode .record-wrap {
  display: flex;
  width: 100%;
  height: auto;
  aspect-ratio: 1 / 1;
}

body.mini-mode .record {
  width: 100%;
  height: 100%;
}


/* =========================================
   JUMBO
========================================= */

body.jumbo-mode {
  padding: 15px;
}

body.jumbo-mode .player-card {
  padding: 17px;
}

body.jumbo-mode .art-wrap {
  width: 145px;
  height: 145px;
  min-width: 145px;
  flex-basis: 145px;
}

body.jumbo-mode .record-wrap {
  width: 145px;
  height: 145px;
  min-width: 145px;
  flex-basis: 145px;
}

body.jumbo-mode .song {
  gap: 16px;
}

body.jumbo-mode .song-name {
  font-size: 18px;
}

body.jumbo-mode .artist {
  font-size: 13px;
}

body.jumbo-mode .control {
  height: 38px;
  min-width: 40px;
}

body.jumbo-mode .play {
  min-width: 58px;
}


/* =========================================
   VERY SMALL WINDOWS
========================================= */

@media (max-width: 260px) {

  body:not(.micro-mode) {
    padding: 6px;
  }

  body:not(.micro-mode) .card {
    padding: 8px;
  }

  body:not(.micro-mode) .song {
    gap: 7px;
  }

  body:not(.micro-mode) .art-wrap {
    width: 52px;
    height: 52px;
    min-width: 52px;
    flex-basis: 52px;
  }

  body.record-style:not(.micro-mode) .record-wrap {
    width: 52px;
    height: 52px;
    min-width: 52px;
    flex-basis: 52px;
  }

  body:not(.micro-mode) .controls {
    gap: 3px;
  }

  body:not(.micro-mode) .control {
    min-width: 29px;
    height: 28px;
    padding: 0 5px;
    font-size: 11px;
  }

  .grid {
    grid-template-columns: 1fr;
  }
}

</style>
</head>

/* =====================================================
   CONFIG
===================================================== */

const CLIENT_ID =
  "d3445d44d1314d07b1d7a7904bbe5a48";

const AUTH_URL =
  "https://dexxx02348.github.io/my-hub/auth.html";

const TRUSTED_ORIGIN =
  "https://dexxx02348.github.io";


/* =====================================================
   ELEMENTS
===================================================== */

const art =
  document.getElementById("art");

const song =
  document.getElementById("song");

const artist =
  document.getElementById("artist");

const progress =
  document.getElementById("progress");

const current =
  document.getElementById("current");

const duration =
  document.getElementById("duration");

const play =
  document.getElementById("play");

const volume =
  document.getElementById("volume");

const device =
  document.getElementById("device");

const status =
  document.getElementById("connectStatus");

const settingsPanel =
  document.getElementById("settingsPanel");

const record =
  document.getElementById("record");

const recordLabel =
  document.getElementById("recordLabel");


/* =====================================================
   MODE
===================================================== */

const validModes = [
  "micro",
  "mini",
  "normal",
  "jumbo"
];

let mode =
  localStorage.getItem("myhub_mode") ||
  "normal";


/* =====================================================
   PLAYER STYLE
===================================================== */

let playerStyle =
  localStorage.getItem("myhub_player_style") ||
  "cover";


function applyPlayerStyle(style) {

  if (
    style !== "cover" &&
    style !== "record"
  ) {

    style = "cover";

  }

  playerStyle = style;

  document.body.classList.toggle(
    "record-style",
    style === "record"
  );

  document
    .querySelectorAll(".style-button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.style === style
      );

    });

  localStorage.setItem(
    "myhub_player_style",
    style
  );

  updateRecordAnimation();

}


document
  .querySelectorAll(".style-button")
  .forEach(button => {

    button.onclick = () => {

      applyPlayerStyle(
        button.dataset.style
      );

    };

  });


/* =====================================================
   MODE
===================================================== */

function sendModeToParent(selectedMode) {

  if (
    window.parent &&
    window.parent !== window
  ) {

    window.parent.postMessage(
      {
        type: "myhub-resize",

}

/* =====================================================
   TOKEN
===================================================== */

async function refreshToken() {

  const refresh =
    localStorage.getItem(
      "spotify_refresh_token"
    );

  if (!refresh) {

    throw new Error(
      "Spotify is not connected."
    );

  }

  const body =
    new URLSearchParams({

      grant_type:
        "refresh_token",

      refresh_token:
        refresh,

      client_id:
        CLIENT_ID

    });

  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },
        body: body.toString()
      }
    );

  const text =
    await response.text();

  let data = null;

  try {

    data =
      text
        ? JSON.parse(text)
        : null;

  } catch {

    throw new Error(
      "Spotify returned an invalid token response."
    );

  }

  if (!response.ok) {

    localStorage.removeItem(
      "spotify_access_token"
    );

    localStorage.removeItem(
      "spotify_refresh_token"
    );

    localStorage.removeItem(
      "spotify_expires_at"
    );

    throw new Error(
      data?.error_description ||
      data?.error ||
      "Spotify login expired."
    );

  }

  localStorage.setItem(
    "spotify_access_token",
    data.access_token
  );

  if (data.refresh_token) {

    localStorage.setItem(
      "spotify_refresh_token",
      data.refresh_token
    );

  }

  localStorage.setItem(
    "spotify_expires_at",
    String(
      Date.now() +
      data.expires_in * 1000
    )
  );

  return data.access_token;

}


async function getToken() {

  const token =
    localStorage.getItem(
      "spotify_access_token"
    );

  const expiry =
    Number(
      localStorage.getItem(
        "spotify_expires_at"
      ) || 0
    );

  if (
    token &&
    Date.now() <
    expiry - 60000
  ) {

    return token;

  }

  return refreshToken();

}


/* =====================================================
   SPOTIFY API
===================================================== */

async function spotify(
  endpoint,
  options = {},
  retry = true
) {

  const token =
    await getToken();

  const response =
    await fetch(
      "https://api.spotify.com/v1" +
      endpoint,
      {
        ...options,

        headers: {
          ...(options.headers || {}),
          Authorization:
            "Bearer " +
            token
        }
      }
    );


  if (
    response.status === 401 &&
    retry
  ) {

    await refreshToken();

    return spotify(
      endpoint,
      options,
      false
    );

  }


  if (
    response.status === 204
  ) {

    return null;

  }


  const text =
    await response.text();

  if (
    response.ok &&
    !text
  ) {

    return null;

  }


  let data = null;

  if (text) {

    try {

      data =
        JSON.parse(text);

    } catch {

      if (response.ok) {

        return null;

      }

      throw new Error(
        "Spotify returned an unexpected response."
      );

    }

  }


  if (!response.ok) {

    throw new Error(
      data?.error?.message ||
      "Spotify error " +
      response.status
    );

  }

  return data;

}


/* =====================================================
   TIME
===================================================== */

function formatTime(ms) {

  const totalSeconds =
    Math.floor(ms / 1000);

  const minutes =
    Math.floor(totalSeconds / 60);

  const seconds =
    String(
      totalSeconds % 60
    ).padStart(
      2,
      "0"
    );

  return (
    minutes +
    ":" +
    seconds
  );

}

/* =====================================================
   PLAYBACK
===================================================== */

let playback = null;

let updateInProgress =
  false;


async function updatePlayback() {

  if (updateInProgress) {

    return;

  }

  updateInProgress =
    true;

  try {

    playback =
      await spotify(
        "/me/player"
      );


    if (
      !playback ||
      !playback.item
    ) {

      song.textContent =
        "Nothing playing";

      artist.textContent =
        "Open Spotify and start playing something";

      art.removeAttribute(
        "src"
      );

      play.textContent =
        "▶";

      document.getElementById(
        "microPlay"
      ).textContent =
        "▶";

      device.textContent =
        "Spotify";

      status.textContent =
        "Connected";

      updateRecordAnimation();

      return;

    }


    const item =
      playback.item;


    song.textContent =
      item.name ||
      "Unknown";


    artist.textContent =
      (item.artists || [])
        .map(
          a => a.name
        )
        .join(", ") ||
      "Unknown artist";


    const image =
      item.album?.images?.[1]?.url ||
      item.album?.images?.[0]?.url;


    if (image) {

      art.src =
        image;

      updateRecordArtwork(
        image
      );

    }


    const total =
      item.duration_ms ||
      0;


    const position =
      playback.progress_ms ||
      0;


    current.textContent =
      formatTime(position);


    duration.textContent =
      formatTime(total);


    progress.value =
      total
        ? (
            position /
            total
          ) * 1000
        : 0;


    const playing =
      !!playback.is_playing;


    play.textContent =
      playing
        ? "⏸"
        : "▶";


    document.getElementById(
      "microPlay"
    ).textContent =
      playing
        ? "⏸"
        : "▶";


    if (playback.device) {

      device.textContent =
        "Playing on " +
        playback.device.name;

    } else {

      device.textContent =
        "Spotify";

    }


    status.textContent =
      "Connected";


    updateRecordAnimation();


  } catch (error) {

    status.textContent =
      error.message;

  } finally {

    updateInProgress =
      false;

  }

}

/* SNAKE */

document.getElementById(
  "snake"
).onclick =
() => {

  showGame(`

    ${gameHeader("Snake")}

    <div
      style="
        text-align:center;
        color:#9aa0a6;
        font-size:10px;
        margin-bottom:7px;
      "
    >
      Use the arrow keys
    </div>

    <canvas
      id="snakeCanvas"
      width="280"
      height="280"
    ></canvas>

    <div
      id="snakeScore"
      class="status"
      style="text-align:center"
    >
      Score: 0
    </div>

  `);

  document.getElementById(
    "backGames"
  ).onclick =
    returnToGames;

  const canvas =
    document.getElementById(
      "snakeCanvas"
    );

  const ctx =
    canvas.getContext("2d");

  const cell = 14;
  const size = 20;

  let snakeBody = [
    {x:10,y:10},
    {x:9,y:10},
    {x:8,y:10}
  ];

  let dx = 1;
  let dy = 0;

  let score = 0;
  let running = true;

  let food = {

    x:
      Math.floor(
        Math.random() * size
      ),

    y:
      Math.floor(
        Math.random() * size
      )

  };


  function draw() {

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.fillStyle =
      "#8ab4f8";

    snakeBody.forEach(part => {

      ctx.fillRect(
        part.x * cell,
        part.y * cell,
        cell - 1,
        cell - 1
      );

    });

    ctx.fillStyle =
      "#e8eaed";

    ctx.fillRect(
      food.x * cell,
      food.y * cell,
      cell - 1,
      cell - 1
    );

  }


  function tick() {

    if (!running) {

      return;

    }

    const head = {

      x:
        snakeBody[0].x + dx,

      y:
        snakeBody[0].y + dy

    };


    if (

      head.x < 0 ||
      head.x >= size ||
      head.y < 0 ||
      head.y >= size ||

      snakeBody.some(
        part =>
          part.x === head.x &&
          part.y === head.y
      )

    ) {

      running = false;

      document.getElementById(
        "snakeScore"
      ).textContent =
        "Game over — Score: " +
        score;

      return;

    }


    snakeBody.unshift(
      head
    );


    if (
      head.x === food.x &&
      head.y === food.y
    ) {

      score++;

      document.getElementById(
        "snakeScore"
      ).textContent =
        "Score: " +
        score;


      do {

        food = {

          x:
            Math.floor(
              Math.random() * size
            ),

          y:
            Math.floor(
              Math.random() * size
            )

        };

      } while (
        snakeBody.some(
          part =>
            part.x === food.x &&
            part.y === food.y
        )
      );

    } else {

      snakeBody.pop();

    }


    draw();

    setTimeout(
      tick,
      120
    );

  }


  window.onkeydown =
    event => {

      if (
        event.key === "ArrowUp" &&
        dy !== 1
      ) {

        dx = 0;
        dy = -1;

      }

      if (
        event.key === "ArrowDown" &&
        dy !== -1
      ) {

        dx = 0;
        dy = 1;

      }

      if (
        event.key === "ArrowLeft" &&
        dx !== 1
      ) {

        dx = -1;
        dy = 0;

      }

      if (
        event.key === "ArrowRight" &&
        dx !== -1
      ) {

        dx = 1;
        dy = 0;

      }

    };


  draw();
  tick();

};
