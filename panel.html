<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Hub</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  width: 100%;
  min-width: 0;
  min-height: 0;

  padding: 10px;

  background: #202124;
  color: #e8eaed;

  font-family: Arial, Roboto, sans-serif;

  overflow: auto;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar {
  width: 100%;
  height: 28px;

  display: flex;
  align-items: center;
  justify-content: flex-end;

  margin-bottom: 6px;
}

.settings-button {
  width: 27px;
  height: 27px;

  padding: 0;
  border: 0;
  border-radius: 50%;

  background: transparent;
  color: #9aa0a6;

  font-size: 14px;
}

.settings-button:hover {
  background: #35363a;
  color: #fff;
}


/* =====================================================
   CARDS
===================================================== */

.card {
  width: 100%;
  min-width: 0;

  background: #292a2d;

  border: 1px solid #3c4043;
  border-radius: 12px;

  padding: 12px;

  margin-bottom: 9px;
}

.section {
  color: #9aa0a6;

  font-size: 10px;

  text-transform: uppercase;
  letter-spacing: .6px;

  margin-bottom: 9px;
}

.status {
  color: #9aa0a6;

  font-size: 10px;

  line-height: 1.4;

  margin-top: 7px;
}


/* =====================================================
   SPOTIFY
===================================================== */

.player-card {
  position: relative;
}

.song {
  width: 100%;
  min-width: 0;

  display: flex;
  align-items: center;

  gap: 10px;
}

.art-wrap {
  position: relative;

  width: 64px;
  height: 64px;

  flex: 0 0 64px;

  min-width: 0;
}

.art {
  display: block;

  width: 100%;
  height: 100%;

  border-radius: 8px;

  object-fit: cover;

  background: #3c4043;
}

.song-info {
  min-width: 0;
  flex: 1 1 auto;
}

.song-name {
  min-width: 0;

  font-size: 14px;
  font-weight: 500;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artist {
  min-width: 0;

  color: #9aa0a6;

  font-size: 11px;

  margin-top: 4px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-area {
  width: 100%;

  margin-top: 10px;
}

.range {
  display: block;

  width: 100%;

  margin: 0;

  accent-color: #8ab4f8;
}

.times {
  width: 100%;

  display: flex;
  justify-content: space-between;

  color: #9aa0a6;

  font-size: 9px;

  margin-top: 2px;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls {
  width: 100%;

  display: flex;
  justify-content: center;
  align-items: center;

  gap: 5px;

  margin-top: 8px;

  flex-wrap: wrap;
}

.control {
  min-width: 34px;
  height: 32px;

  padding: 0 8px;

  border: 0;
  border-radius: 8px;

  background: #35363a;
  color: #e8eaed;
}

.control:hover {
  background: #45464a;
}

.play {
  min-width: 48px;

  background: #8ab4f8;
  color: #202124;

  font-weight: 600;
}

.play:hover {
  background: #a8c7fa;
}

.volume {
  width: 100%;
  margin-top: 8px;
}

.device {
  color: #80868b;

  font-size: 9px;

  margin-top: 6px;

  text-align: center;
}


/* =====================================================
   MICRO HOVER
===================================================== */

.micro-overlay {
  position: absolute;

  left: 0;
  top: 0;
  right: 0;
  bottom: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 3px;

  background: rgba(0,0,0,.48);

  border-radius: 8px;

  opacity: 0;

  pointer-events: none;

  transition: opacity .12s;
}

.art-wrap:hover .micro-overlay {
  opacity: 1;
  pointer-events: auto;
}

.micro-control {
  width: 23px;
  height: 23px;

  padding: 0;

  border: 0;
  border-radius: 50%;

  background: rgba(25,26,28,.9);

  color: #fff;

  font-size: 10px;
}

.micro-control:hover {
  background: #45464a;
}

.micro-settings {
  position: absolute;

  right: 3px;
  bottom: 3px;

  width: 20px;
  height: 20px;

  padding: 0;

  border: 0;
  border-radius: 50%;

  background: rgba(25,26,28,.9);

  color: #d4d7da;

  font-size: 10px;
}


/* =====================================================
   RECORD
===================================================== */

.record-wrap {
  display: none;

  width: 64px;
  height: 64px;

  flex: 0 0 64px;

  align-items: center;
  justify-content: center;
}

.record {
  position: relative;

  width: 100%;
  height: 100%;

  border-radius: 50%;

  background:
    repeating-radial-gradient(
      circle,
      #080808 0,
      #161616 3px,
      #080808 6px
    );

  box-shadow:
    inset 0 0 0 2px #252525,
    0 6px 16px rgba(0,0,0,.4);
}

.record-label {
  position: absolute;

  left: 25%;
  top: 25%;

  width: 50%;
  height: 50%;

  border-radius: 50%;

  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
}

.record-hole {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 9px;
  height: 9px;

  transform: translate(-50%,-50%);

  border-radius: 50%;

  background: #111;

  box-shadow:
    inset 0 0 0 2px #444;
}

.record-playing {
  animation: recordSpin 3s linear infinite;
}

@keyframes recordSpin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

body.record-style .art-wrap {
  display: none;
}

body.record-style .record-wrap {
  display: flex;
}


/* =====================================================
   QUICK LINKS
===================================================== */

.grid {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0,1fr));

  gap: 6px;
}

.link {
  width: 100%;
  min-width: 0;
  height: 35px;

  padding: 0 10px;

  border: 1px solid #3c4043;
  border-radius: 8px;

  background: #292a2d;
  color: #e8eaed;

  text-align: left;

  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.link:hover {
  background: #35363a;
}


/* =====================================================
   SETTINGS
===================================================== */

.settings-panel {
  position: fixed;

  top: 40px;
  right: 10px;

  width: min(240px, calc(100vw - 20px));

  padding: 13px;

  background: #292a2d;

  border: 1px solid #4a4d50;
  border-radius: 11px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.35);

  z-index: 1000;
}

.settings-title {
  font-size: 14px;
  font-weight: 500;

  margin-bottom: 12px;
}

.setting-label {
  color: #9aa0a6;

  font-size: 10px;

  text-transform: uppercase;

  letter-spacing: .5px;

  margin-bottom: 7px;
}

.mode-grid,
.style-grid {
  display: grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap: 5px;

  margin-bottom: 12px;
}

.mode-button,
.style-button {
  height: 32px;

  border: 1px solid #3c4043;
  border-radius: 7px;

  background: #202124;

  color: #e8eaed;

  font-size: 11px;
}

.mode-button:hover,
.style-button:hover {
  background: #35363a;
}

.mode-button.active,
.style-button.active {
  background: #303b4c;

  border-color: #8ab4f8;

  color: #a8c7fa;
}


/* =====================================================
   SWITCH
===================================================== */

.setting-row {
  min-height: 34px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  font-size: 11px;
}

.switch {
  position: relative;

  width: 34px;
  height: 20px;
}

.switch input {
  opacity: 0;

  width: 0;
  height: 0;
}

.slider {
  position: absolute;

  left: 0;
  top: 0;
  right: 0;
  bottom: 0;

  border-radius: 20px;

  background: #45464a;
}

.slider::before {
  content: "";

  position: absolute;

  width: 14px;
  height: 14px;

  left: 3px;
  top: 3px;

  border-radius: 50%;

  background: #9aa0a6;

  transition: .15s;
}

.switch input:checked + .slider {
  background: #6d93c5;
}

.switch input:checked + .slider::before {
  transform: translateX(14px);

  background: #e8eaed;
}


/* =====================================================
   GAMES
===================================================== */

.game-area {
  width: 100%;

  margin-top: 8px;
}

.game-header {
  width: 100%;

  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-bottom: 8px;
}

.game-title {
  font-size: 13px;
  font-weight: 500;
}

.back {
  height: 28px;

  font-size: 10px;
}

.game-button {
  width: 100%;
  height: 100px;
}

.game-center {
  width: 100%;

  text-align: center;

  padding: 10px;
}

.score {
  font-size: 28px;

  margin: 8px 0;
}

.guess-input {
  width: 100%;
  height: 34px;

  padding: 0 9px;

  border: 1px solid #3c4043;
  border-radius: 8px;

  background: #202124;
  color: #e8eaed;

  outline: none;
}

canvas {
  display: block;

  width: 100%;
  max-width: 280px;

  height: auto;

  margin: 0 auto;

  border: 1px solid #3c4043;
  border-radius: 9px;
}


/* =====================================================
   MICRO MODE
===================================================== */

body.micro-mode {
  width: 100%;
  height: 100%;

  padding: 0;

  overflow: hidden;

  background: transparent;
}

body.micro-mode .topbar {
  position: absolute;

  left: auto;
  top: 3px;
  right: 3px;

  width: 23px;
  height: 23px;

  margin: 0;

  z-index: 20;
}

body.micro-mode .settings-button {
  width: 22px;
  height: 22px;

  background: rgba(32,33,36,.8);

  font-size: 10px;
}

body.micro-mode .player-card {
  width: 100%;
  height: 100%;

  padding: 0;
  margin: 0;

  background: transparent;

  border: 0;
}

body.micro-mode .player-card > .section,
body.micro-mode .song-info,
body.micro-mode #connectStatus,
body.micro-mode .progress-area,
body.micro-mode .controls,
body.micro-mode .volume,
body.micro-mode .device {
  display: none;
}

body.micro-mode .song {
  width: 100%;
  height: 100%;

  display: block;
}

body.micro-mode .art-wrap {
  width: 100%;
  height: 100%;

  flex: none;
}

body.micro-mode .art {
  width: 100%;
  height: 100%;

  border-radius: 9px;

  object-fit: cover;
}

body.micro-mode .record-wrap {
  width: 100%;
  height: 100%;

  flex: none;
}

body.micro-mode .record {
  width: 100%;
  height: 100%;

  border-radius: 50%;
}


/* =====================================================
   MINI MODE
===================================================== */

body.mini-mode {
  width: 100%;
  height: 100%;

  padding: 7px;

  overflow: hidden;
}

body.mini-mode .quick-section,
body.mini-mode .games-section {
  display: none;
}

body.mini-mode .player-card {
  width: 100%;
  height: 100%;

  padding: 7px;

  margin: 0;
}

body.mini-mode .section,
body.mini-mode .song-info,
body.mini-mode .progress-area,
body.mini-mode .volume,
body.mini-mode .device,
body.mini-mode #connectStatus {
  display: none;
}

body.mini-mode .song {
  width: 100%;
  height: 100%;

  display: flex;

  flex-direction: column;

  justify-content: space-between;

  gap: 6px;
}

body.mini-mode .art-wrap {
  width: 100%;
  height: auto;

  aspect-ratio: 1 / 1;

  flex: 1 1 auto;

  min-height: 0;
}

body.mini-mode .art {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

body.mini-mode .record-wrap {
  width: 100%;
  height: auto;

  aspect-ratio: 1 / 1;

  flex: 1 1 auto;

  min-height: 0;
}

body.mini-mode .record {
  width: 100%;
  height: 100%;
}


/* MINI BUTTONS UNDER ART */

body.mini-mode .micro-overlay {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;
  top: auto;

  height: 38px;

  opacity: 1;

  pointer-events: auto;

  border-radius: 0 0 8px 8px;

  background: linear-gradient(
    transparent,
    rgba(0,0,0,.78)
  );
}

body.mini-mode .micro-control {
  width: 25px;
  height: 25px;
}

body.mini-mode .micro-settings {
  display: block;

  z-index: 10;
}


/* MINI SETTINGS ICON ALWAYS VISIBLE */

body.mini-mode .topbar {
  position: absolute;

  top: 3px;
  right: 3px;

  width: 24px;
  height: 24px;

  z-index: 50;
}

body.mini-mode .settings-button {
  display: block;

  width: 23px;
  height: 23px;

  background: rgba(32,33,36,.8);

  font-size: 11px;
}


/* =====================================================
   NORMAL
===================================================== */

body.normal-mode {
  width: 100%;
  min-height: 100%;

  padding: 10px;
}


/* =====================================================
   JUMBO
===================================================== */

body.jumbo-mode {
  width: 100%;
  min-height: 100%;

  padding: 15px;
}

body.jumbo-mode .player-card {
  padding: 17px;
}

body.jumbo-mode .art-wrap,
body.jumbo-mode .record-wrap {
  width: 145px;
  height: 145px;

  flex: 0 0 145px;
}

body.jumbo-mode .song-name {
  font-size: 18px;
}

body.jumbo-mode .artist {
  font-size: 13px;
}

body.jumbo-mode .control {
  height: 38px;
}

body.jumbo-mode .play {
  min-width: 58px;
}


/* =====================================================
   SMALL WIDTH SAFETY
===================================================== */

@media (max-width: 260px) {

  body.normal-mode,
  body.jumbo-mode {
    padding: 6px;
  }

  body.normal-mode .card,
  body.jumbo-mode .card {
    padding: 8px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .controls {
    gap: 3px;
  }

  .control {
    min-width: 29px;
    height: 28px;

    padding: 0 5px;

    font-size: 11px;
  }
}

</style>
</head>

<body>

<!-- =================================================
     TOP
================================================= -->

<div class="topbar">

  <button
    id="settingsButton"
    class="settings-button"
    title="Settings"
  >⚙</button>

</div>


<!-- =================================================
     SETTINGS
================================================= -->

<div
  id="settingsPanel"
  class="settings-panel hidden"
>

  <div class="settings-title">
    My Hub Settings
  </div>


  <div class="setting-label">
    Display size
  </div>


  <div class="mode-grid">

    <button
      class="mode-button"
      data-mode="micro"
    >Micro</button>

    <button
      class="mode-button"
      data-mode="mini"
    >Mini</button>

    <button
      class="mode-button"
      data-mode="normal"
    >Normal</button>

    <button
      class="mode-button"
      data-mode="jumbo"
    >Jumbo</button>

  </div>


  <div class="setting-label">
    Player style
  </div>


  <div class="style-grid">

    <button
      class="style-button"
      data-style="cover"
    >Cover</button>

    <button
      class="style-button"
      data-style="record"
    >Record</button>

  </div>


  <div class="setting-row">

    <span>Quick links</span>

    <label class="switch">

      <input
        id="linksToggle"
        type="checkbox"
        checked
      >

      <span class="slider"></span>

    </label>

  </div>


  <div class="setting-row">

    <span>Mini games</span>

    <label class="switch">

      <input
        id="gamesToggle"
        type="checkbox"
        checked
      >

      <span class="slider"></span>

    </label>

  </div>


  <button
    id="disconnect"
    style="
      width:100%;
      height:32px;
      margin-top:10px;
      border:0;
      border-radius:8px;
      background:#35363a;
      color:#e8eaed;
      font-size:11px;
    "
  >
    Reconnect Spotify
  </button>

</div>


<!-- =================================================
     SPOTIFY PLAYER
================================================= -->

<div class="card player-card">

  <div class="section">
    Spotify
  </div>


  <div class="song">

    <div class="art-wrap">

      <img
        id="art"
        class="art"
        alt=""
      >


      <div class="micro-overlay">

        <button
          id="microPrev"
          class="micro-control"
        >⏮</button>

        <button
          id="microPlay"
          class="micro-control"
        >▶</button>

        <button
          id="microNext"
          class="micro-control"
        >⏭</button>

      </div>


      <button
        id="microSettings"
        class="micro-settings"
      >⚙</button>

    </div>


    <div class="record-wrap">

      <div
        id="record"
        class="record"
      >

        <div
          id="recordLabel"
          class="record-label"
        ></div>

        <div class="record-hole"></div>

      </div>

    </div>


    <div class="song-info">

      <div
        id="song"
        class="song-name"
      >
        Nothing playing
      </div>

      <div
        id="artist"
        class="artist"
      >
        Spotify
      </div>

    </div>

  </div>


  <div
    id="connectStatus"
    class="status"
  >
    Checking Spotify...
  </div>


  <div id="playerControls">

    <div class="progress-area">

      <input
        id="progress"
        class="range"
        type="range"
        min="0"
        max="1000"
        value="0"
      >


      <div class="times">

        <span id="current">
          0:00
        </span>

        <span id="duration">
          0:00
        </span>

      </div>

    </div>


    <div class="controls">

      <button
        id="shuffle"
        class="control"
      >🔀</button>

      <button
        id="previous"
        class="control"
      >⏮</button>

      <button
        id="play"
        class="control play"
      >▶</button>

      <button
        id="next"
        class="control"
      >⏭</button>

      <button
        id="repeat"
        class="control"
      >🔁</button>

    </div>


    <div class="volume">

      <input
        id="volume"
        class="range"
        type="range"
        min="0"
        max="100"
        value="50"
      >

    </div>


    <div
      id="device"
      class="device"
    >
      Spotify
    </div>

  </div>

</div>


<!-- =================================================
     QUICK LINKS
================================================= -->

<div
  id="quickSection"
  class="card quick-section"
>

  <div class="section">
    Quick Links
  </div>


  <div class="grid">

    <button
      class="link"
      data-url="https://www.google.com"
    >
      Google
    </button>

    <button
      class="link"
      data-url="https://www.youtube.com"
    >
      YouTube
    </button>

    <button
      class="link"
      data-url="https://drive.google.com"
    >
      Google Drive
    </button>

    <button
      class="link"
      data-url="https://github.com"
    >
      GitHub
    </button>

  </div>

</div>


<!-- =================================================
     GAMES
================================================= -->

<div
  id="gamesSection"
  class="card games-section"
>

  <div class="section">
    Mini Games
  </div>


  <div
    id="gameMenu"
    class="grid"
  >

    <button id="clicker">
      🖱 Clicker
    </button>

    <button id="guess">
      🔢 Number Guess
    </button>

    <button id="reaction">
      ⚡ Reaction
    </button>

    <button id="snake">
      🐍 Snake
    </button>

  </div>


  <div
    id="gameArea"
    class="game-area hidden"
  ></div>

</div>


<script>

/* =====================================================
   SPOTIFY CONFIG
===================================================== */

const CLIENT_ID =
  "d3445d44d1314d07b1d7a7904bbe5a48";

const AUTH_URL =
  "https://dexxx02348.github.io/my-hub/auth.html";

const TRUSTED_ORIGIN =
  "https://dexxx02348.github.io";


/* =====================================================
   ELEMENTS
===================================================== */

const art =
  document.getElementById("art");

const song =
  document.getElementById("song");

const artist =
  document.getElementById("artist");

const progress =
  document.getElementById("progress");

const current =
  document.getElementById("current");

const duration =
  document.getElementById("duration");

const play =
  document.getElementById("play");

const volume =
  document.getElementById("volume");

const device =
  document.getElementById("device");

const status =
  document.getElementById("connectStatus");

const settingsPanel =
  document.getElementById("settingsPanel");

const record =
  document.getElementById("record");

const recordLabel =
  document.getElementById("recordLabel");


/* =====================================================
   SIZE MODES
===================================================== */

const validModes = [
  "micro",
  "mini",
  "normal",
  "jumbo"
];

let mode =
  localStorage.getItem("myhub_mode") ||
  "normal";


function applyMode(newMode) {

  if (
    !validModes.includes(newMode)
  ) {
    newMode = "normal";
  }


  mode = newMode;


  document.body.classList.remove(
    "micro-mode",
    "mini-mode",
    "normal-mode",
    "jumbo-mode"
  );


  document.body.classList.add(
    newMode + "-mode"
  );


  document
    .querySelectorAll(".mode-button")

/* =====================================================
   TOKEN
===================================================== */

async function refreshToken() {

  const refresh =
    localStorage.getItem(
      "spotify_refresh_token"
    );


  if (!refresh) {

    throw new Error(
      "Spotify is not connected."
    );

  }


  const body =
    new URLSearchParams({

      grant_type:
        "refresh_token",

      refresh_token:
        refresh,

      client_id:
        CLIENT_ID

    });


  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
          body.toString()
      }
    );


  const text =
    await response.text();


  let data;


  try {

    data =
      text
        ? JSON.parse(text)
        : null;

  } catch {

    throw new Error(
      "Invalid Spotify response."
    );

  }


  if (!response.ok) {

    throw new Error(
      data?.error_description ||
      data?.error ||
      "Spotify login expired."
    );

  }


  localStorage.setItem(
    "spotify_access_token",
    data.access_token
  );


  if (
    data.refresh_token
  ) {

    localStorage.setItem(
      "spotify_refresh_token",
      data.refresh_token
    );

  }


  localStorage.setItem(
    "spotify_expires_at",
    String(
      Date.now() +
      data.expires_in * 1000
    )
  );


  return data.access_token;

}


async function getToken() {

  const token =
    localStorage.getItem(
      "spotify_access_token"
    );


  const expiry =
    Number(
      localStorage.getItem(
        "spotify_expires_at"
      ) ||
      0
    );


  if (
    token &&
    Date.now() <
      expiry - 60000
  ) {

    return token;

  }


  return refreshToken();

}


/* =====================================================
   SPOTIFY API
===================================================== */

async function spotify(
  endpoint,
  options = {},
  retry = true
) {

  const token =
    await getToken();


  const response =
    await fetch(
      "https://api.spotify.com/v1" +
      endpoint,
      {

        ...options,

        headers: {

          ...(options.headers || {}),

          Authorization:
            "Bearer " +
            token

        }

      }
    );


  if (
    response.status === 401 &&
    retry
  ) {

    await refreshToken();

    return spotify(
      endpoint,
      options,
      false
    );

  }


  if (
    response.status === 204
  ) {

    return null;

  }


  const text =
    await response.text();


  if (
    !text
  ) {

    return null;

  }


  let data;


  try {

    data =
      JSON.parse(text);

  } catch {

    throw new Error(
      "Spotify returned an invalid response."
    );

  }


  if (
    !response.ok
  ) {

    throw new Error(
      data?.error?.message ||
      "Spotify error " +
      response.status
    );

  }


  return data;

}


/* =====================================================
   TIME
===================================================== */

function formatTime(ms) {

  const totalSeconds =
    Math.floor(
      ms / 1000
    );


  const minutes =
    Math.floor(
      totalSeconds / 60
    );


  const seconds =
    String(
      totalSeconds % 60
    ).padStart(
      2,
      "0"
    );


  return (
    minutes +
    ":" +
    seconds
  );

}

    return;

/* =====================================================
   PLAYBACK
===================================================== */

let playback = null;

let updating = false;


async function updatePlayback() {

  if (updating) {

    return;

  }


  updating = true;


  try {

    playback =
      await spotify(
        "/me/player"
      );


    if (
      !playback ||
      !playback.item
    ) {

      song.textContent =
        "Nothing playing";

      artist.textContent =
        "Spotify";


      art.removeAttribute(
        "src"
      );


      play.textContent =
        "▶";


      document.getElementById(
        "microPlay"
      ).textContent =
        "▶";


      status.textContent =
        "Connected";


      updateRecordAnimation();

      return;

    }


    const item =
      playback.item;


    song.textContent =
      item.name ||
      "Unknown";


    artist.textContent =
      (item.artists || [])
        .map(
          a => a.name
        )
        .join(", ") ||
      "Unknown artist";


    const image =
      item.album?.images?.[1]?.url ||
      item.album?.images?.[0]?.url;


    if (image) {

      art.src =
        image;

      updateRecordArtwork(
        image
      );

    }


    const total =
      item.duration_ms ||
      0;


    const position =
      playback.progress_ms ||
      0;


    current.textContent =
      formatTime(
        position
      );


    duration.textContent =
      formatTime(
        total
      );


    progress.value =
      total
        ? position / total * 1000
        : 0;


    const playing =
      !!playback.is_playing;


    play.textContent =
      playing
        ? "⏸"
        : "▶";


    document.getElementById(
      "microPlay"
    ).textContent =
      playing
        ? "⏸"
        : "▶";


    device.textContent =
      playback.device
        ? "Playing on " +
          playback.device.name
        : "Spotify";


    status.textContent =
      "Connected";


    updateRecordAnimation();

  } catch (error) {

    status.textContent =
      error.message;

  } finally {

    updating = false;

  }

}

/* SNAKE */

document.getElementById(
  "snake"
).onclick =
() => {

  showGame(`

    ${gameHeader("Snake")}

    <div
      style="
        text-align:center;
        color:#9aa0a6;
        font-size:10px;
        margin-bottom:7px;
      "
    >
      Use the arrow keys
    </div>

    <canvas
      id="snakeCanvas"
      width="280"
      height="280"
    ></canvas>

    <div
      id="snakeScore"
      class="status"
      style="text-align:center"
    >
      Score: 0
    </div>

  `);


  document.getElementById(
    "backGames"
  ).onclick =
    returnToGames;


  const canvas =
    document.getElementById(
      "snakeCanvas"
    );


  const ctx =
    canvas.getContext("2d");


  const cell = 14;
  const size = 20;


  let snakeBody = [
    {x:10,y:10},
    {x:9,y:10},
    {x:8,y:10}
  ];


  let dx = 1;
  let dy = 0;


  let score = 0;
  let running = true;


  let food = {

    x:
      Math.floor(
        Math.random() * size
      ),

    y:
      Math.floor(
        Math.random() * size
      )

  };


  function draw() {

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.fillStyle =
      "#8ab4f8";


    snakeBody.forEach(part => {

      ctx.fillRect(
        part.x * cell,
        part.y * cell,
        cell - 1,
        cell - 1
      );

    });


    ctx.fillStyle =
      "#e8eaed";


    ctx.fillRect(
      food.x * cell,
      food.y * cell,
      cell - 1,
      cell - 1
    );

  }


  function tick() {

    if (!running) {
      return;
    }


    const head = {

      x:
        snakeBody[0].x +
        dx,

      y:
        snakeBody[0].y +
        dy

    };


    if (

      head.x < 0 ||
      head.x >= size ||
      head.y < 0 ||
      head.y >= size ||

      snakeBody.some(
        part =>
          part.x === head.x &&
          part.y === head.y
      )

    ) {

      running = false;

      document.getElementById(
        "snakeScore"
      ).textContent =
        "Game over — Score: " +
        score;

      return;

    }


    snakeBody.unshift(
      head
    );


    if (
      head.x === food.x &&
      head.y === food.y
    ) {

      score++;


      document.getElementById(
        "snakeScore"
      ).textContent =
        "Score: " +
        score;


      do {

        food = {

          x:
            Math.floor(
              Math.random() * size
            ),

          y:
            Math.floor(
              Math.random() * size
            )

        };

      } while (
        snakeBody.some(
          part =>
            part.x === food.x &&
            part.y === food.y
        )
      );

    } else {

      snakeBody.pop();

    }


    draw();


    setTimeout(
      tick,
      120
    );

  }


  window.onkeydown =
    event => {

      if (
        event.key === "ArrowUp" &&
        dy !== 1
      ) {

        dx = 0;
        dy = -1;

      }

      if (
        event.key === "ArrowDown" &&
        dy !== -1
      ) {

        dx = 0;
        dy = 1;

      }

      if (
        event.key === "ArrowLeft" &&
        dx !== 1
      ) {

        dx = -1;
        dy = 0;

      }

      if (
        event.key === "ArrowRight" &&
        dx !== -1
      ) {

        dx = 1;
        dy = 0;

      }

    };


  draw();
  tick();

};
