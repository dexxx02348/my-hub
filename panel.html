<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Hub</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-width:0;min-height:0}
body{font-family:Arial,Roboto,sans-serif;background:#202124;color:#e8eaed;padding:10px;overflow:auto}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
:root{--bg:#202124;--card:#292a2d;--border:#3c4043;--muted:#9aa0a6;--accent:#8ab4f8}

.topbar{height:28px;display:flex;justify-content:flex-end;align-items:center;margin-bottom:6px}
.settings-button,.micro-settings{border:0;border-radius:50%;background:transparent;color:#9aa0a6}
.settings-button{width:27px;height:27px;font-size:14px}
.settings-button:hover{background:#35363a;color:#fff}

.card{width:100%;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:9px}
.section{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:9px}
.status{color:var(--muted);font-size:10px;line-height:1.4;margin-top:7px;min-height:14px}

.player-card{position:relative}
.song{width:100%;min-width:0;display:flex;align-items:center;gap:10px}
.art-wrap,.record-wrap{position:relative;width:64px;height:64px;min-width:0;flex:0 0 64px}
.art{display:block;width:100%;height:100%;object-fit:cover;border-radius:8px;background:#3c4043}
.song-info{min-width:0;flex:1 1 auto}
.song-name,.artist{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.song-name{font-size:14px;font-weight:600}.artist{color:var(--muted);font-size:11px;margin-top:4px}

.progress-area{width:100%;margin-top:10px}.range{display:block;width:100%;margin:0;accent-color:var(--accent)}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;margin-top:2px}
.controls{width:100%;display:flex;justify-content:center;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap}
.control{min-width:34px;height:32px;padding:0 8px;border:0;border-radius:8px;background:#35363a;color:#e8eaed}
.control:hover{background:#45464a}.play{min-width:48px;background:var(--accent);color:#202124;font-weight:700}
.volume{width:100%;margin-top:8px}.device{color:#80868b;font-size:9px;margin-top:6px;text-align:center}

.record-wrap{display:none;align-items:center;justify-content:center}
.record{position:relative;width:100%;height:100%;aspect-ratio:1/1;border-radius:50%;
background:repeating-radial-gradient(circle,#080808 0,#151515 3px,#080808 6px);
box-shadow:inset 0 0 0 2px #252525,0 6px 16px rgba(0,0,0,.4);overflow:hidden}
.record-label{position:absolute;inset:25%;border-radius:50%;background-position:center;background-size:cover;background-repeat:no-repeat}
.record-hole{position:absolute;left:50%;top:50%;width:9px;height:9px;transform:translate(-50%,-50%);
border-radius:50%;background:#111;box-shadow:inset 0 0 0 2px #444}
.record-playing{animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

.micro-overlay{position:absolute;left:0;right:0;bottom:0;height:42px;display:flex;align-items:center;justify-content:center;gap:4px;
background:linear-gradient(transparent,rgba(0,0,0,.85));border-radius:0 0 8px 8px;opacity:0;pointer-events:none;transition:opacity .12s}
.art-wrap:hover .micro-overlay{opacity:1;pointer-events:auto}
.micro-control{width:27px;height:27px;padding:0;border:0;border-radius:50%;background:rgba(20,20,20,.9);color:#fff;font-size:10px}
.micro-control:hover{background:#45464a}
.micro-settings{position:absolute;right:3px;bottom:3px;width:20px;height:20px;padding:0;background:rgba(20,20,20,.9);color:#fff;font-size:10px;z-index:5}
.micro-settings:hover{background:#45464a}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.link,.game-menu button{width:100%;min-width:0;height:35px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:#292a2d;color:#e8eaed;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.link:hover,.game-menu button:hover{background:#35363a}
.game-area{width:100%;margin-top:8px}.game-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.game-title{font-size:13px;font-weight:600}.back{height:28px;border:0;border-radius:7px;background:#35363a;color:#e8eaed;font-size:10px}
.game-center{text-align:center;padding:8px}.game-button{width:100%;height:105px;border:0;border-radius:8px;background:#35363a;color:#e8eaed;font-size:20px}
.score{font-size:28px;margin:8px 0}.guess-input{width:100%;height:34px;padding:0 9px;border:1px solid var(--border);border-radius:8px;background:#202124;color:#e8eaed;outline:none}
canvas{display:block;width:100%;max-width:280px;height:auto;margin:0 auto;border:1px solid var(--border);border-radius:9px;background:#202124}

.settings-panel{position:fixed;top:4px;right:4px;width:min(240px,calc(100vw - 8px));max-height:calc(100vh - 8px);padding:13px;background:#292a2d;border:1px solid #4a4d50;border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.45);overflow-y:auto;z-index:1000}
.settings-title{font-size:14px;font-weight:700;margin-bottom:12px}
.setting-label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.mode-grid,.style-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-bottom:12px}
.mode-button,.style-button{width:100%;min-width:0;height:32px;border:1px solid var(--border);border-radius:7px;background:#202124;color:#e8eaed;font-size:11px}
.mode-button.active,.style-button.active{background:#303b4c;border-color:#8ab4f8;color:#a8c7fa}
.setting-row{min-height:34px;display:flex;align-items:center;justify-content:space-between;font-size:11px}
.switch{position:relative;width:34px;height:20px}.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;border-radius:20px;background:#45464a}.slider:before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;border-radius:50%;background:#9aa0a6;transition:.15s}
.switch input:checked + .slider{background:#6d93c5}.switch input:checked + .slider:before{transform:translateX(14px);background:#e8eaed}
.settings-close{float:right;border:0;background:transparent;color:var(--muted);font-size:16px}
.reconnect{width:100%;height:32px;border:0;border-radius:7px;background:#35363a;color:#e8eaed}

body.micro-mode{padding:0;overflow:hidden;background:transparent}
body.micro-mode .topbar{position:absolute;top:3px;right:3px;width:22px;height:22px;margin:0;z-index:50}
body.micro-mode .settings-button{width:21px;height:21px;background:rgba(20,20,20,.78);font-size:10px}
body.micro-mode .player-card{width:100%;height:100%;padding:0;margin:0;background:transparent;border:0}
body.micro-mode .song{height:100%;display:block}
body.micro-mode .art-wrap{width:100%;height:100%;aspect-ratio:1/1;flex:none}
body.micro-mode .art{width:100%;height:100%;border-radius:9px}
body.micro-mode .section,body.micro-mode .song-info,body.micro-mode .progress-area,body.micro-mode .controls,body.micro-mode .volume,body.micro-mode .device,
body.micro-mode #connectStatus,body.micro-mode .quick-section,body.micro-mode .games-section{display:none}
body.micro-mode .micro-overlay{height:38px}
body.micro-mode.record-style .art-wrap{display:none}
body.micro-mode.record-style .record-wrap{display:flex;width:100%;height:100%;flex:none}
body.micro-mode .micro-settings{display:block}

body.mini-mode{padding:6px;overflow:hidden}
body.mini-mode .quick-section,body.mini-mode .games-section{display:none}
body.mini-mode .topbar{position:absolute;top:2px;right:2px;width:24px;height:24px;margin:0;z-index:50}
body.mini-mode .settings-button{display:block;width:23px;height:23px;background:rgba(20,20,20,.8);font-size:11px}
body.mini-mode .player-card{height:100%;padding:6px;margin:0}
body.mini-mode .section,body.mini-mode .song-info,body.mini-mode .progress-area,body.mini-mode .volume,body.mini-mode .device,body.mini-mode #connectStatus{display:none}
body.mini-mode .song{height:100%;display:block}
body.mini-mode .art-wrap,body.mini-mode .record-wrap{width:min(100%,calc(100vh - 18px));height:auto;aspect-ratio:1/1;margin:0 auto}
body.mini-mode .art{width:100%;height:100%}
body.mini-mode .micro-overlay{opacity:1;pointer-events:auto;height:42px}
body.mini-mode .micro-settings{display:none}
body.mini-mode.record-style .art-wrap{display:none}
body.mini-mode.record-style .record-wrap{display:flex}
body.mini-mode .record{width:100%;height:100%}

body.normal-mode{overflow-x:hidden;overflow-y:auto}
body.jumbo-mode{padding:14px;overflow-x:hidden;overflow-y:auto}
body.jumbo-mode .art-wrap,body.jumbo-mode .record-wrap{width:clamp(90px,24vw,145px);height:auto;aspect-ratio:1/1;flex:0 0 clamp(90px,24vw,145px)}
body.jumbo-mode .song-name{font-size:18px}.body.jumbo-mode .artist{font-size:13px}
body.jumbo-mode .control{height:38px}.body.jumbo-mode .play{min-width:58px}

body.record-style .record-wrap{display:flex}
body.record-style .art-wrap{display:none}
body.record-style .record-wrap{aspect-ratio:1/1;height:auto}
body.record-style .song > .record-wrap{flex:0 0 auto}

@media(max-width:260px){
  body.normal-mode,body.jumbo-mode{padding:6px}
  .card{padding:8px}
  .song{gap:6px}
  .art-wrap,.record-wrap{width:52px;height:auto;aspect-ratio:1/1;flex:0 0 52px}
  .control{min-width:28px;height:28px;padding:0 5px;font-size:11px}
  .grid{grid-template-columns:1fr}
  .settings-panel{width:calc(100vw - 6px);left:3px;right:3px;top:3px;max-height:calc(100vh - 6px);padding:9px}
}
</style>
</head>
<body class="normal-mode">
<div class="topbar"><button id="settingsBtn" class="settings-button" title="Settings">⚙</button></div>

<div class="card player-card">
  <div class="section">Spotify</div>
  <div class="song">
    <div class="art-wrap">
      <img id="art" class="art" alt="" draggable="false">
      <div class="micro-overlay">
        <button id="microPrev" class="micro-control" title="Previous">⏮</button>
        <button id="microPlay" class="micro-control" title="Play / Pause">▶</button>
        <button id="microNext" class="micro-control" title="Next">⏭</button>
      </div>
      <button id="microSettings" class="micro-settings" title="Settings">⚙</button>
    </div>
    <div class="record-wrap">
      <div id="record" class="record">
        <div id="recordLabel" class="record-label"></div>
        <div class="record-hole"></div>
      </div>
    </div>
    <div class="song-info">
      <div id="song" class="song-name">Nothing playing</div>
      <div id="artist" class="artist">Spotify</div>
    </div>
  </div>
  <div class="progress-area">
    <input id="progress" class="range" type="range" min="0" max="1000" value="0">
    <div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div>
  </div>
  <div id="playerControls" class="controls">
    <button id="shuffle" class="control" title="Shuffle">🔀</button>
    <button id="prev" class="control" title="Previous">⏮</button>
    <button id="play" class="control play" title="Play / Pause">▶</button>
    <button id="next" class="control" title="Next">⏭</button>
    <button id="repeat" class="control" title="Repeat">🔁</button>
  </div>
  <div class="volume"><input id="volume" class="range" type="range" min="0" max="100" value="50"></div>
  <div id="device" class="device">Spotify</div>
  <div id="connectStatus" class="status">Not connected</div>
</div>

<div id="quickSection" class="card quick-section">
  <div class="section">Quick Links</div>
  <div class="grid">
    <button class="link" data-url="https://www.google.com">Google</button>
    <button class="link" data-url="https://www.youtube.com">YouTube</button>
    <button class="link" data-url="https://drive.google.com">Google Drive</button>
    <button class="link" data-url="https://github.com">GitHub</button>
  </div>
</div>

<div id="gamesSection" class="card games-section">
  <div class="section">Mini Games</div>
  <div id="gameMenu" class="grid game-menu">
    <button id="clicker">🖱 Clicker</button>
    <button id="guess">🔢 Number Guess</button>
    <button id="reaction">⚡ Reaction</button>
    <button id="snake">🐍 Snake</button>
  </div>
  <div id="gameArea" class="game-area hidden"></div>
</div>

<div id="settingsPanel" class="settings-panel hidden">
  <button id="closeSettings" class="settings-close" title="Close">×</button>
  <div class="settings-title">My Hub Settings</div>
  <div class="setting-label">Display Size</div>
  <div class="mode-grid">
    <button class="mode-button" data-mode="micro">Micro</button>
    <button class="mode-button" data-mode="mini">Mini</button>
    <button class="mode-button" data-mode="normal">Normal</button>
    <button class="mode-button" data-mode="jumbo">Jumbo</button>
  </div>
  <div class="setting-label">Player Style</div>
  <div class="style-grid">
    <button class="style-button" data-style="cover">Cover</button>
    <button class="style-button" data-style="record">Record</button>
  </div>
  <div class="setting-row"><span>Quick Links</span><label class="switch"><input id="linksToggle" type="checkbox"><span class="slider"></span></label></div>
  <div class="setting-row"><span>Mini Games</span><label class="switch"><input id="gamesToggle" type="checkbox"><span class="slider"></span></label></div>
  <div style="margin-top:9px"><button id="disconnect" class="reconnect">Reconnect Spotify</button></div>
</div>

<script>
(() => {
  "use strict";

  const CLIENT_ID = "d3445d44d1314d07b1d7a7904bbe5a48";
  const AUTH_URL = "https://dexxx02348.github.io/my-hub/auth.html";
  const TRUSTED_ORIGIN = "https://dexxx02348.github.io";
  const MODES = {
    micro: [86,86],
    mini: [230,280],
    normal: [390,680],
    jumbo: [560,800]
  };

  const $ = (id) => document.getElementById(id);
  const art = $("art"), song = $("song"), artist = $("artist"), play = $("play");
  const progress = $("progress"), current = $("current"), duration = $("duration");
  const volume = $("volume"), device = $("device"), status = $("connectStatus");
  const record = $("record"), recordLabel = $("recordLabel");

  let playback = null, updating = false, progressDragging = false;
  let mode = ["micro","mini","normal","jumbo"].includes(localStorage.getItem("myhub_mode"))
    ? localStorage.getItem("myhub_mode") : "normal";
  let style = localStorage.getItem("myhub_style") === "record" ? "record" : "cover";
  let linksOn = localStorage.getItem("myhub_links") !== "false";
  let gamesOn = localStorage.getItem("myhub_games") !== "false";

  function post(type, payload={}) {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({type, ...payload}, TRUSTED_ORIGIN);
    }
  }

  function applyMode(newMode, tellParent=true) {
    if (!MODES[newMode]) newMode = "normal";
    mode = newMode;
    document.body.classList.remove("micro-mode","mini-mode","normal-mode","jumbo-mode");
    document.body.classList.add(newMode + "-mode");
    document.querySelectorAll(".mode-button").forEach(b => b.classList.toggle("active", b.dataset.mode === newMode));
    localStorage.setItem("myhub_mode", newMode);
    if (tellParent) post("myhub-resize",{mode:newMode,width:MODES[newMode][0],height:MODES[newMode][1]});
  }

  function applyStyle(newStyle) {
    style = newStyle === "record" ? "record" : "cover";
    document.body.classList.toggle("record-style", style === "record");
    document.querySelectorAll(".style-button").forEach(b => b.classList.toggle("active", b.dataset.style === style));
    localStorage.setItem("myhub_style", style);
    updateRecordAnimation();
  }

  function updateToggles() {
    $("linksToggle").checked = linksOn;
    $("gamesToggle").checked = gamesOn;
    $("quickSection").classList.toggle("hidden", !linksOn);
    $("gamesSection").classList.toggle("hidden", !gamesOn);
  }

  function formatTime(ms) {
    const s = Math.max(0, Math.floor((ms || 0) / 1000));
    return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  }

  function updateRecordArtwork(url) {
    recordLabel.style.backgroundImage = url ? `url("${url.replaceAll('"','%22')}")` : "";
  }
  function updateRecordAnimation() {
    record.classList.toggle("record-playing", style === "record" && !!playback?.is_playing);
  }

  async function refreshToken() {
    const refresh = localStorage.getItem("spotify_refresh_token");
    if (!refresh) throw new Error("Spotify is not connected.");
    const body = new URLSearchParams({grant_type:"refresh_token",refresh_token:refresh,client_id:CLIENT_ID});
    const r = await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});
    const data = await r.json().catch(()=>null);
    if (!r.ok) throw new Error(data?.error_description || data?.error || "Spotify login expired.");
    if (data.access_token) localStorage.setItem("spotify_access_token",data.access_token);
    if (data.refresh_token) localStorage.setItem("spotify_refresh_token",data.refresh_token);
    localStorage.setItem("spotify_expires_at",String(Date.now()+data.expires_in*1000));
    return data.access_token;
  }

  async function getToken() {
    const token = localStorage.getItem("spotify_access_token");
    const expiry = Number(localStorage.getItem("spotify_expires_at") || 0);
    if (token && Date.now() < expiry - 60000) return token;
    return refreshToken();
  }

  async function spotify(endpoint, options={}, retry=true) {
    const token = await getToken();
    let r = await fetch("https://api.spotify.com/v1"+endpoint,{
      ...options,
      headers:{...(options.headers||{}),Authorization:`Bearer ${token}`,"Content-Type":"application/json"}
    });
    if (r.status === 401 && retry) {
      await refreshToken();
      return spotify(endpoint,options,false);
    }
    if (r.status === 204) return null;
    const data = await r.json().catch(()=>null);
    if (!r.ok) throw new Error(data?.error?.message || `Spotify error ${r.status}`);
    return data;
  }

  async function updatePlayback() {
    if (updating) return;
    updating = true;
    try {
      playback = await spotify("/me/player");
      if (!playback?.item) {
        song.textContent="Nothing playing"; artist.textContent="Spotify"; art.removeAttribute("src");
        updateRecordArtwork(""); play.textContent="▶"; $("microPlay").textContent="▶";
        status.textContent="Connected"; updateRecordAnimation(); return;
      }
      const item = playback.item;
      song.textContent=item.name || "Unknown";
      artist.textContent=(item.artists||[]).map(a=>a.name).join(", ") || "Unknown artist";
      const image=item.album?.images?.[1]?.url || item.album?.images?.[0]?.url || "";
      if (image) { art.src=image; updateRecordArtwork(image); }
      const pos=playback.progress_ms||0, total=item.duration_ms||0;
      current.textContent=formatTime(pos); duration.textContent=formatTime(total);
      if (!progressDragging) progress.value=total ? String((pos/total)*1000) : "0";
      const playing=!!playback.is_playing;
      play.textContent=playing?"⏸":"▶"; $("microPlay").textContent=playing?"⏸":"▶";
      device.textContent=playback.device?.name ? "Playing on "+playback.device.name : "Spotify";
      status.textContent="Connected"; updateRecordAnimation();
    } catch (e) {
      status.textContent = e.message || "Spotify unavailable";
    } finally { updating=false; }
  }

  async function togglePlay() {
    try {
      await spotify(playback?.is_playing ? "/me/player/pause" : "/me/player/play",{method:"PUT"});
      setTimeout(updatePlayback,300);
    } catch(e){status.textContent=e.message}
  }
  async function prev(){try{await spotify("/me/player/previous",{method:"POST"});setTimeout(updatePlayback,350)}catch(e){status.textContent=e.message}}
  async function next(){try{await spotify("/me/player/next",{method:"POST"});setTimeout(updatePlayback,350)}catch(e){status.textContent=e.message}}
  async function setVolume(v){try{await spotify("/me/player/volume?volume_percent="+encodeURIComponent(v),{method:"PUT"});}catch(e){status.textContent=e.message}}
  async function toggleShuffle(){try{const on=!playback?.shuffle_state;await spotify("/me/player/shuffle?state="+on,{method:"PUT"});updatePlayback()}catch(e){status.textContent=e.message}}
  async function toggleRepeat(){try{const nextMode=playback?.repeat_state==="off"?"context":playback?.repeat_state==="context"?"track":"off";await spotify("/me/player/repeat?state="+nextMode,{method:"PUT"});updatePlayback()}catch(e){status.textContent=e.message}}
  async function seek(v){
    if(!playback?.item?.duration_ms) return;
    const ms=Math.round(Number(v)/1000*playback.item.duration_ms);
    try{await spotify("/me/player/seek?position_ms="+ms,{method:"PUT"});setTimeout(updatePlayback,150)}catch(e){status.textContent=e.message}
  }

  $("play").onclick=togglePlay; $("microPlay").onclick=togglePlay;
  $("prev").onclick=prev; $("microPrev").onclick=prev;
  $("next").onclick=next; $("microNext").onclick=next;
  $("shuffle").onclick=toggleShuffle; $("repeat").onclick=toggleRepeat;
  volume.oninput=()=>setVolume(Number(volume.value));
  progress.addEventListener("input",()=>{progressDragging=true;const total=playback?.item?.duration_ms||0;current.textContent=formatTime(Number(progress.value)/1000*total)});
  progress.addEventListener("change",()=>{progressDragging=false;seek(progress.value)});
  document.querySelectorAll(".link").forEach(b=>b.onclick=()=>window.open(b.dataset.url,"_blank","noopener,noreferrer"));

  $("settingsBtn").onclick=()=>$("settingsPanel").classList.remove("hidden");
  $("microSettings").onclick=(e)=>{e.stopPropagation();$("settingsPanel").classList.remove("hidden")};
  $("closeSettings").onclick=()=>$("settingsPanel").classList.add("hidden");
  document.querySelectorAll(".mode-button").forEach(b=>b.onclick=()=>applyMode(b.dataset.mode,true));
  document.querySelectorAll(".style-button").forEach(b=>b.onclick=()=>applyStyle(b.dataset.style));
  $("linksToggle").onchange=()=>{linksOn=$("linksToggle").checked;localStorage.setItem("myhub_links",String(linksOn));updateToggles()};
  $("gamesToggle").onchange=()=>{gamesOn=$("gamesToggle").checked;localStorage.setItem("myhub_games",String(gamesOn));updateToggles()};
  $("disconnect").onclick=()=>{
    ["spotify_access_token","spotify_refresh_token","spotify_expires_at"].forEach(k=>localStorage.removeItem(k));
    window.open(AUTH_URL,"myhubSpotifyAuth","width=500,height=700");
  };

  function closeGame(){ $("gameArea").classList.add("hidden"); $("gameMenu").classList.remove("hidden"); $("gameArea").innerHTML=""; }
  function showGame(title,html){$("gameMenu").classList.add("hidden");$("gameArea").classList.remove("hidden");$("gameArea").innerHTML=`<div class="game-header"><div class="game-title">${title}</div><button class="back" id="backGame">Back</button></div>${html}`;$("backGame").onclick=closeGame}

  $("clicker").onclick=()=>{
    showGame("Clicker",`<div class="game-center"><div>Clicks</div><div id="clickScore" class="score">0</div><button id="clickTarget" class="game-button">CLICK</button></div>`);
    let n=0;$("clickTarget").onclick=()=>{$("clickScore").textContent=String(++n)};
  };
  $("guess").onclick=()=>{
    showGame("Number Guess",`<div class="game-center"><div>Guess a number from 1–100</div><div id="guessHint" style="margin:10px 0;color:#9aa0a6">Good luck</div><input id="guessInput" class="guess-input" inputmode="numeric" placeholder="Number"><button id="guessBtn" class="game-button" style="height:48px;margin-top:8px">Guess</button></div>`);
    const target=Math.floor(Math.random()*100)+1;let attempts=0;
    $("guessBtn").onclick=()=>{const n=Number($("guessInput").value);if(!n)return;attempts++;$("guessHint").textContent=n===target?`Correct in ${attempts} guess${attempts===1?"":"es"}!`:n<target?"Too low":"Too high";if(n===target){$("guessBtn").textContent="New Game";$("guessBtn").onclick=()=>document.getElementById("guess").click()}};
  };
  $("reaction").onclick=()=>{
    showGame("Reaction",`<div class="game-center"><div id="reactionMsg">Wait for green…</div><button id="reactionArea" class="game-button">WAIT</button></div>`);
    let ready=false,start=0,timer=null; const area=$("reactionArea"),msg=$("reactionMsg");
    const delay=800+Math.random()*2500; timer=setTimeout(()=>{ready=true;start=performance.now();area.textContent="CLICK!";msg.textContent="GO!";},delay);
    area.onclick=()=>{if(!ready){clearTimeout(timer);msg.textContent="Too early — restart";area.textContent="Restart";area.onclick=()=>document.getElementById("reaction").click();}else{msg.textContent=`${Math.round(performance.now()-start)} ms`;area.textContent="Again";area.onclick=()=>document.getElementById("reaction").click()}};
  };
  $("snake").onclick=()=>{
    showGame("Snake",`<div class="game-center"><canvas id="snakeCanvas" width="280" height="280"></canvas><div style="margin-top:7px;color:#9aa0a6;font-size:10px">Use arrow keys</div></div>`);
    const c=$("snakeCanvas"),ctx=c.getContext("2d"),size=14,grid=20;
    let snake=[[10,10],[9,10],[8,10]],dir=[1,0],next=dir.slice(),food=[14,10],alive=true;
    function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle="#3c4043";ctx.fillRect(food[0]*size,food[1]*size,size,size);ctx.fillStyle="#8ab4f8";snake.forEach(([x,y])=>ctx.fillRect(x*size,y*size,size-1,size-1))}
    function tick(){if(!alive)return;dir=next.slice();const h=[snake[0][0]+dir[0],snake[0][1]+dir[1]];if(h[0]<0||h[1]<0||h[0]>=grid||h[1]>=grid||snake.some(([x,y])=>x===h[0]&&y===h[1])){alive=false;return}snake.unshift(h);if(h[0]===food[0]&&h[1]===food[1]){do{food=[Math.floor(Math.random()*grid),Math.floor(Math.random()*grid)]}while(snake.some(([x,y])=>x===food[0]&&y===food[1]))}else snake.pop();draw()}
    const key=(e)=>{const k=e.key;if(k==="ArrowUp"&&dir[1]!==1)next=[0,-1];if(k==="ArrowDown"&&dir[1]!==-1)next=[0,1];if(k==="ArrowLeft"&&dir[0]!==1)next=[-1,0];if(k==="ArrowRight"&&dir[0]!==-1)next=[1,0]};document.addEventListener("keydown",key);draw();const id=setInterval(tick,120);$("backGame").addEventListener("click",()=>{clearInterval(id);document.removeEventListener("keydown",key)},{once:true});
  };

  document.addEventListener("visibilitychange",()=>{if(!document.hidden)updatePlayback()});
  updateToggles(); applyStyle(style); applyMode(mode,false);

  // Crucial iframe -> bookmarklet handshake. The parent stays hidden until this is sent.
  requestAnimationFrame(()=>post("myhub-ready",{mode,width:MODES[mode][0],height:MODES[mode][1]}));

  updatePlayback();
  setInterval(()=>{if(!document.hidden)updatePlayback()},5000);
  setInterval(()=>{
    if(playback?.is_playing && playback.item?.duration_ms && !progressDragging){
      const v=Number(progress.value)+(5000/playback.item.duration_ms)*1000;
      progress.value=String(Math.min(1000,v));
      current.textContent=formatTime(v/1000*playback.item.duration_ms);
    }
  },5000);
})();
</script>
</body>
</html>
