<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Hub</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #202124;
  color: #e8eaed;
  font-family: Arial, Roboto, sans-serif;
}

body {
  padding: 10px;
}

.card {
  background: #292a2d;
  border: 1px solid #3c4043;
  border-radius: 11px;
  padding: 12px;
  margin-bottom: 10px;
}

.section {
  color: #9aa0a6;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 9px;
}

.song {
  display: flex;
  align-items: center;
  gap: 10px;
}

.art {
  width: 58px;
  height: 58px;
  border-radius: 7px;
  background: #3c4043;
  object-fit: cover;
  flex-shrink: 0;
}

.song-info {
  min-width: 0;
}

.song-name {
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artist {
  color: #9aa0a6;
  font-size: 11px;
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.range {
  width: 100%;
  accent-color: #8ab4f8;
  cursor: pointer;
}

.progress {
  margin-top: 9px;
}

.times {
  display: flex;
  justify-content: space-between;
  color: #9aa0a6;
  font-size: 9px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  margin-top: 8px;
}

button {
  border: 0;
  border-radius: 8px;
  height: 32px;
  padding: 0 9px;
  background: #35363a;
  color: #e8eaed;
  cursor: pointer;
}

button:hover {
  background: #45464a;
}

.play {
  background: #8ab4f8;
  color: #202124;
  font-weight: 500;
  min-width: 48px;
}

.play:hover {
  background: #a8c7fa;
}

.small-button {
  font-size: 11px;
}

.volume {
  margin-top: 8px;
}

.status {
  color: #9aa0a6;
  font-size: 10px;
  margin-top: 7px;
  min-height: 14px;
}

.connect-button {
  width: 100%;
  background: #8ab4f8;
  color: #202124;
  font-weight: 500;
}

.connect-button:hover {
  background: #a8c7fa;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.link {
  width: 100%;
  text-align: left;
}

.game-area {
  margin-top: 9px;
}

.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.game-title {
  font-size: 13px;
  font-weight: 500;
}

.back {
  font-size: 10px;
  height: 28px;
}

.game-button {
  width: 100%;
  height: 110px;
  font-size: 21px;
}

.game-center {
  text-align: center;
  padding: 12px;
}

.score {
  font-size: 28px;
  margin: 12px 0;
}

.guess-input {
  width: 100%;
  height: 34px;
  border: 1px solid #3c4043;
  border-radius: 8px;
  background: #202124;
  color: #e8eaed;
  padding: 0 9px;
  outline: none;
}

.guess-input:focus {
  border-color: #8ab4f8;
}

canvas {
  display: block;
  width: 100%;
  max-width: 280px;
  height: auto;
  margin: 0 auto;
  background: #202124;
  border: 1px solid #3c4043;
  border-radius: 9px;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<!-- =========================
     SPOTIFY
========================= -->

<div class="card">

  <div class="section">
    Spotify
  </div>

  <!-- LOGIN -->
  <div id="connectBox">

    <div class="status" style="margin-bottom: 9px;">
      Connect Spotify to control playback.
    </div>

    <button
      id="connect"
      class="connect-button"
    >
      Connect Spotify
    </button>

  </div>


  <!-- PLAYER -->
  <div id="player" class="hidden">

    <div class="song">

      <img
        id="art"
        class="art"
        alt=""
      >

      <div class="song-info">

        <div
          id="song"
          class="song-name"
        >
          Nothing playing
        </div>

        <div
          id="artist"
          class="artist"
        >
          Spotify
        </div>

      </div>

    </div>


    <div class="progress">

      <input
        id="progress"
        class="range"
        type="range"
        min="0"
        max="1000"
        value="0"

      <div class="times">

        <span id="current">

        </span>

        <span id="duration">

        </span>

    </div>


    <div class="controls">

        class="play"

      >

      </button>

      <button
        id="forward"

      <button

        title="Next"
      >

  </div>

<!-- =========================
     QUICK LINKS
========================= -->

<div class="card">

  <div class="section">
    Quick Links
  </div>

  <div class="grid">

    <button
      class="link"
      data-url="https://www.google.com"
    >
      Google
    </button>

    <button
      class="link"
      data-url="https://www.youtube.com"
    >
      YouTube
    </button>

    <button
      class="link"
      data-url="https://drive.google.com"
    >
      Google Drive
    </button>

    <button
      class="link"
      data-url="https://github.com"
    >
      GitHub
    </button>

  </div>

</div>


<!-- =========================
     GAMES
========================= -->

<div class="card">

  <div class="section">
    Mini Games
  </div>

  <div
    id="gameMenu"
    class="grid"
  >

    <button id="clicker">
      🖱 Clicker
    </button>

    <button id="guess">
      🔢 Number Guess
    </button>

    <button id="reaction">
      ⚡ Reaction
    </button>

    <button id="snake">
      🐍 Snake
    </button>

  </div>

  <div
    id="gameArea"
    class="game-area hidden"
  ></div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const CLIENT_ID =
  "d3445d44d1314d07b1d7a7904bbe5a48";

const AUTH_URL =
  "https://dexxx02348.github.io/my-hub/auth.html";

const TRUSTED_ORIGIN =
  "https://dexxx02348.github.io";


/* =====================================================
   ELEMENTS
===================================================== */

const connectBox =
  document.getElementById("connectBox");

const player =
  document.getElementById("player");

const art =
  document.getElementById("art");

const song =
  document.getElementById("song");

const artist =
  document.getElementById("artist");

const progress =
  document.getElementById("progress");

const current =
  document.getElementById("current");

const duration =
  document.getElementById("duration");

const play =
  document.getElementById("play");

const status =
  document.getElementById("status");

const volume =
  document.getElementById("volume");

const gameMenu =
  document.getElementById("gameMenu");

const gameArea =
  document.getElementById("gameArea");


/* =====================================================
   SPOTIFY AUTH POPUP RESPONSE
===================================================== */

window.addEventListener(
  "message",
  async (event) => {

    if (
      event.origin !==
      TRUSTED_ORIGIN
    ) {
      return;
    }

    if (
      event.data?.type !==
      "myhub-spotify-connected"
    ) {
      return;
    }

    if (
      !event.data.access_token
    ) {
      return;
    }

    localStorage.setItem(
      "spotify_access_token",
      event.data.access_token
    );

    if (
      event.data.refresh_token
    ) {

      localStorage.setItem(
        "spotify_refresh_token",
        event.data.refresh_token
      );

    }

    localStorage.setItem(
      "spotify_expires_at",
      String(
        event.data.expires_at
      )
    );

    connectBox.classList.add(
      "hidden"
    );

    player.classList.remove(
      "hidden"
    );

    await updatePlayback();

  }
);


/* =====================================================
   CONNECT BUTTON
===================================================== */

document
  .getElementById("connect")
  .onclick = () => {

    const popup =
      window.open(
        AUTH_URL,
        "myhubSpotifyAuth",
        "width=500,height=700"
      );

    if (!popup) {

      status.textContent =
        "Popup blocked. Allow popups for GitHub Pages.";

    }

  };


/* =====================================================
   REFRESH TOKEN
===================================================== */

async function refreshToken() {

  const refresh =
    localStorage.getItem(
      "spotify_refresh_token"
    );

  if (!refresh) {

    throw new Error(
      "Spotify is not connected."
    );

  }


  const body =
    new URLSearchParams({

      grant_type:
        "refresh_token",

      refresh_token:
        refresh,

      client_id:
        CLIENT_ID

    });


  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {

        method: "POST",

        headers: {

          "Content-Type":
            "application/x-www-form-urlencoded"

        },

        body:
          body.toString()

      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    localStorage.removeItem(
      "spotify_access_token"
    );

    localStorage.removeItem(
      "spotify_refresh_token"
    );

    localStorage.removeItem(
      "spotify_expires_at"
    );

    throw new Error(
      data.error_description ||
      "Spotify login expired."
    );

  }


  localStorage.setItem(
    "spotify_access_token",
    data.access_token
  );


  if (data.refresh_token) {

    localStorage.setItem(
      "spotify_refresh_token",
      data.refresh_token
    );

  }


  localStorage.setItem(
    "spotify_expires_at",
    String(
      Date.now() +
      data.expires_in * 1000
    )
  );


  return data.access_token;

}


/* =====================================================
   GET TOKEN
===================================================== */

async function getToken() {

  const token =
    localStorage.getItem(
      "spotify_access_token"
    );

  const expires =
    Number(
      localStorage.getItem(
        "spotify_expires_at"
      ) || 0
    );


  if (
    token &&
    Date.now() <
      expires - 60000
  ) {

    return token;

  }


  return refreshToken();

}


/* =====================================================
   SPOTIFY API REQUEST
===================================================== */

async function spotify(
  endpoint,
  options = {},
  retry = true
) {

  let token =
    await getToken();


  let response =
    await fetch(
      "https://api.spotify.com/v1" +
      endpoint,
      {

        ...options,

        headers: {

          ...(options.headers || {}),

          Authorization:
            "Bearer " + token

        }

      }
    );


  /* Token expired */

  if (
    response.status ===
      401 &&
    retry
  ) {

    token =
      await refreshToken();


    response =
      await fetch(
        "https://api.spotify.com/v1" +
        endpoint,
        {

          ...options,

          headers: {

            ...(options.headers || {}),

            Authorization:
              "Bearer " + token

          }

        }
      );

  }


  if (
    response.status === 204
  ) {

    return null;

  }


  const text =
    await response.text();


  const data =
    text
      ? JSON.parse(text)
      : null;


  if (!response.ok) {

    throw new Error(
      data?.error?.message ||
      "Spotify error " +
      response.status
    );

  }


  return data;

}


/* =====================================================
   TIME FORMAT
===================================================== */

function formatTime(ms) {

  const totalSeconds =
    Math.floor(ms / 1000);

  const minutes =
    Math.floor(
      totalSeconds / 60
    );

  const seconds =
    String(
      totalSeconds % 60
    ).padStart(2, "0");


  return (
    minutes +
    ":" +
    seconds
  );

}


/* =====================================================
   PLAYBACK STATE
===================================================== */

let playback = null;

let progressTimer = null;


/* =====================================================
   UPDATE PLAYER
===================================================== */

async function updatePlayback() {

  try {

    playback =
      await spotify(
        "/me/player"
      );


    if (
      !playback ||
      !playback.item
    ) {

      song.textContent =
        "Nothing playing";

      artist.textContent =
        "Open Spotify and play something";

      art.removeAttribute(
        "src"
      );

      play.textContent =
        "▶";

      status.textContent =
        "Connected";

      return;

    }


    const item =
      playback.item;


    song.textContent =
      item.name ||
      "Unknown";


    artist.textContent =
      (item.artists || [])
        .map(
          a => a.name
        )
        .join(", ") ||
      "Unknown artist";


    const image =
      item.album?.images?.[1]?.url ||
      item.album?.images?.[0]?.url;


    if (image) {

      art.src =
        image;

    }


    const total =
      item.duration_ms ||
      0;

    const position =
      playback.progress_ms ||
      0;


    current.textContent =
      formatTime(position);


    duration.textContent =
      formatTime(total);


    progress.value =
      total
        ? (
            position /
            total
          ) * 1000
        : 0;


    play.textContent =
      playback.is_playing
        ? "⏸"
        : "▶";


    volume.value =
      playback.device?.volume_percent ??
      50;


    status.textContent =
      playback.device
        ? "Device: " +
          playback.device.name
        : "Connected";


  } catch (error) {

    status.textContent =
      error.message;

  }

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

play.onclick =
async () => {

  try {

    if (
      playback?.is_playing
    ) {

      await spotify(
        "/me/player/pause",
        {
          method: "PUT"
        }
      );

    } else {

      await spotify(
        "/me/player/play",
        {
          method: "PUT"
        }
      );

    }


    await updatePlayback();

  } catch (error) {

    status.textContent =
      error.message;

  }

};


/* =====================================================
   PREVIOUS
===================================================== */

document.getElementById(
  "previous"
).onclick =
async () => {

  try {

    await spotify(
      "/me/player/previous",
      {
        method: "POST"
      }
    );

    setTimeout(
      updatePlayback,
      500
    );

  } catch (error) {

    status.textContent =
      error.message;

  }

};


/* =====================================================
   NEXT
===================================================== */

document.getElementById(
  "next"
).onclick =
async () => {

  try {

    await spotify(
      "/me/player/next",
      {
        method: "POST"
      }
    );

    setTimeout(
      updatePlayback,
      500
    );

  } catch (error) {

    status.textContent =
      error.message;

  }

};


/* =====================================================
   BACK 10
===================================================== */

document.getElementById(
  "back"
).onclick =
async () => {

  if (
    !playback?.item
  ) {
    return;
  }


  try {

    const position =
      Math.max(
        0,
        (playback.progress_ms || 0)
          - 10000
      );


    await spotify(
      "/me/player/seek?position_ms=" +
      position,
      {
        method: "PUT"
      }
    );


    await updatePlayback();

  } catch (error) {

    status.textContent =
      error.message;

  }

};


/* =====================================================
   FORWARD 10
===================================================== */

document.getElementById(
  "forward"
).onclick =
async () => {

  if (
    !playback?.item
  ) {
    return;
  }


  try {

    const position =
      Math.min(
        playback.item.duration_ms,
        (playback.progress_ms || 0)
          + 10000
      );


    await spotify(
      "/me/player/seek?position_ms=" +
      position,
      {
        method: "PUT"
      }
    );


    await updatePlayback();

  } catch (error) {

    status.textContent =
      error.message;

  }

};


/* =====================================================
   PROGRESS BAR
===================================================== */

progress.onchange =
async () => {

  if (
    !playback?.item
  ) {
    return;
  }


  try {

    const position =
      Math.floor(
        playback.item.duration_ms *
        Number(
          progress.value
        ) /
        1000
      );


    await spotify(
      "/me/player/seek?position_ms=" +
      position,
      {
        method: "PUT"
      }
    );


    await updatePlayback();

  } catch (error) {

    status.textContent =
      error.message;

  }

};


/* =====================================================
   VOLUME
===================================================== */

volume.onchange =
async () => {

  try {

    await spotify(
      "/me/player/volume?volume_percent=" +
      volume.value,
      {
        method: "PUT"
      }
    );

  } catch (error) {

    status.textContent =
      error.message;

  }

};


/* =====================================================
   SHUFFLE
===================================================== */

document.getElementById(
  "shuffle"
).onclick =
async () => {

  if (!playback) {
    return;
  }


  try {

    const newState =
      !playback.shuffle_state;


    await spotify(
      "/me/player/shuffle?state=" +
      newState,
      {
        method: "PUT"
      }
    );


    playback.shuffle_state =
      newState;


  } catch (error) {

    status.textContent =
      error.message;

  }

};


/* =====================================================
   REPEAT
===================================================== */

let repeatState =
  "off";


document.getElementById(
  "repeat"
).onclick =
async () => {

  const nextState =
    repeatState === "off"
      ? "context"
      : repeatState === "context"
        ? "track"
        : "off";


  try {

    await spotify(
      "/me/player/repeat?state=" +
      nextState,
      {
        method: "PUT"
      }
    );


    repeatState =
      nextState;


    document.getElementById(
      "repeat"
    ).textContent =
      nextState === "track"
        ? "🔂"
        : nextState === "context"
          ? "🔁"
          : "↪";


  } catch (error) {

    status.textContent =
      error.message;

  }

};


/* =====================================================
   PROGRESS ANIMATION
===================================================== */

progressTimer =
  setInterval(
    () => {

      if (
        !playback ||
        !playback.item ||
        !playback.is_playing
      ) {
        return;
      }


      playback.progress_ms =
        Math.min(
          playback.item.duration_ms,
          (playback.progress_ms || 0)
            + 1000
        );


      current.textContent =
        formatTime(
          playback.progress_ms
        );


      progress.value =
        playback.item.duration_ms
          ? (
              playback.progress_ms /
              playback.item.duration_ms
            ) * 1000
          : 0;

    },
    1000
  );


/* =====================================================
   REFRESH SONG INFO
===================================================== */

setInterval(
  updatePlayback,
  4000
);


/* =====================================================
   QUICK LINKS
===================================================== */

document
  .querySelectorAll(".link")
  .forEach(
    button => {

      button.onclick =
        () => {

          window.open(
            button.dataset.url,
            "_blank"
          );

        };

    }
  );


/* =====================================================
   GAMES
===================================================== */

function showGame(
  html
) {

  gameMenu.classList.add(
    "hidden"
  );

  gameArea.classList.remove(
    "hidden"
  );

  gameArea.innerHTML =
    html;

}


function returnToGames() {

  gameArea.classList.add(
    "hidden"
  );

  gameArea.innerHTML =
    "";

  gameMenu.classList.remove(
    "hidden"
  );

}


function gameHeader(
  name
) {

  return `
    <div class="game-header">

      <div class="game-title">
        ${name}
      </div>

      <button
        class="back"
        id="backGames"
      >
        ← Games
      </button>

    </div>
  `;

}


/* =====================================================
   CLICKER
===================================================== */

document.getElementById(
  "clicker"
).onclick =
() => {

  showGame(`

    ${gameHeader(
      "Clicker"
    )}

    <div class="game-center">

      <div
        class="score"
        id="clickScore"
      >
        0
      </div>

      <button
        id="clickTarget"
        class="connect-button"
      >
        CLICK
      </button>

    </div>

  `);


  document.getElementById(
    "backGames"
  ).onclick =
    returnToGames;


  let score = 0;


  document.getElementById(
    "clickTarget"
  ).onclick =
    () => {

      score++;

      document.getElementById(
        "clickScore"
      ).textContent =
        score;

    };

};


/* =====================================================
   NUMBER GUESS
===================================================== */

document.getElementById(
  "guess"
).onclick =
() => {

  const answer =
    Math.floor(
      Math.random() * 100
    ) + 1;


  showGame(`

    ${gameHeader(
      "Number Guess"
    )}

    <div class="game-center">

      <input
        id="guessInput"
        class="guess-input"
        type="number"
        min="1"
        max="100"
        placeholder="Pick 1-100"
      >

      <button
        id="guessButton"
        class="connect-button"
        style="margin-top:7px"
      >
        Guess
      </button>

      <div
        id="guessResult"
        class="status"
      >
        Guess the number.
      </div>

    </div>

  `);


  document.getElementById(
    "backGames"
  ).onclick =
    returnToGames;


  document.getElementById(
    "guessButton"
  ).onclick =
    () => {

      const value =
        Number(
          document.getElementById(
            "guessInput"
          ).value
        );


      const result =
        document.getElementById(
          "guessResult"
        );


      if (
        !value ||
        value < 1 ||
        value > 100
      ) {

        result.textContent =
          "Enter a number from 1-100.";

        return;

      }


      if (
        value === answer
      ) {

        result.textContent =
          "🎉 Correct!";

      } else if (
        value < answer
      ) {

        result.textContent =
          "Too low.";

      } else {

        result.textContent =
          "Too high.";

      }

    };

};


/* =====================================================
   REACTION
===================================================== */

document.getElementById(
  "reaction"
).onclick =
() => {

  showGame(`

    ${gameHeader(
      "Reaction"
    )}

    <button
      id="reactionButton"
      class="game-button"
    >
      WAIT...
    </button>

    <div
      id="reactionResult"
      class="status"
    >
      Wait for GO!
    </div>

  `);


  document.getElementById(
    "backGames"
  ).onclick =
    returnToGames;


  const button =
    document.getElementById(
      "reactionButton"
    );


  const result =
    document.getElementById(
      "reactionResult"
    );


  let ready = false;

  let started = 0;


  const timer =
    setTimeout(
      () => {

        ready = true;

        started =
          performance.now();

        button.textContent =
          "GO!";

        result.textContent =
          "CLICK!";

      },
      1200 +
      Math.random() * 2500
    );


  button.onclick =
    () => {

      if (!ready) {

        clearTimeout(timer);

        button.textContent =
          "Too early!";

        result.textContent =
          "Try again.";

        return;

      }


      const time =
        Math.round(
          performance.now() -
          started
        );


      button.textContent =
        time +
        " ms";


      result.textContent =
        "Nice reaction!";

    };

};


/* =====================================================
   SNAKE
===================================================== */

document.getElementById(
  "snake"
).onclick =
() => {

  showGame(`

    ${gameHeader(
      "Snake"
    )}

    <div
      style="
        text-align:center;
        color:#9aa0a6;
        font-size:10px;
        margin-bottom:7px;
      "
    >
      Use the arrow keys
    </div>

    <canvas
      id="snakeCanvas"
      width="280"
      height="280"
    ></canvas>

    <div
      id="snakeScore"
      class="status"
      style="text-align:center;"
    >
      Score: 0
    </div>

  `);


  document.getElementById(
    "backGames"
  ).onclick =
    returnToGames;


  const canvas =
    document.getElementById(
      "snakeCanvas"
    );

  const ctx =
    canvas.getContext(
      "2d"
    );


  const cell =
    14;

  const size =
    20;


  let snakeBody = [

    {
      x: 10,
      y: 10
    },

    {
      x: 9,
      y: 10
    },

    {
      x: 8,
      y: 10
    }

  ];


  let dx = 1;

  let dy = 0;

  let score = 0;

  let running = true;


  let food = {

    x:
      Math.floor(
        Math.random() *
        size
      ),

    y:
      Math.floor(
        Math.random() *
        size
      )

  };


  function draw() {

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.fillStyle =
      "#8ab4f8";


    snakeBody.forEach(
      part => {

        ctx.fillRect(

          part.x * cell,

          part.y * cell,

          cell - 1,

          cell - 1

        );

      }
    );


    ctx.fillStyle =
      "#e8eaed";


    ctx.fillRect(

      food.x * cell,

      food.y * cell,

      cell - 1,

      cell - 1

    );

  }


  function tick() {

    if (!running) {
      return;
    }


    const head = {

      x:
        snakeBody[0].x +
        dx,

      y:
        snakeBody[0].y +
        dy

    };


    if (

      head.x < 0 ||

      head.x >= size ||

      head.y < 0 ||

      head.y >= size ||

      snakeBody.some(
        part =>
          part.x === head.x &&
          part.y === head.y
      )

    ) {

      running = false;


      document.getElementById(
        "snakeScore"
      ).textContent =
        "Game over — Score: " +
        score;


      return;

    }


    snakeBody.unshift(
      head
    );


    if (

      head.x === food.x &&

      head.y === food.y

    ) {

      score++;


      document.getElementById(
        "snakeScore"
      ).textContent =
        "Score: " +
        score;


      do {

        food = {

          x:
            Math.floor(
              Math.random() *
              size
            ),

          y:
            Math.floor(
              Math.random() *
              size
            )

        };

      } while (

        snakeBody.some(
          part =>
            part.x === food.x &&
            part.y === food.y
        )

      );


    } else {

      snakeBody.pop();

    }


    draw();


    setTimeout(
      tick,
      120
    );

  }


  const keyHandler =
    event => {

      if (

        event.key ===
          "ArrowUp" &&
        dy !== 1

      ) {

        dx = 0;

        dy = -1;

      }


      if (

        event.key ===
          "ArrowDown" &&
        dy !== -1

      ) {

        dx = 0;

        dy = 1;

      }


      if (

        event.key ===
          "ArrowLeft" &&
        dx !== 1

      ) {

        dx = -1;

        dy = 0;

      }


      if (

        event.key ===
          "ArrowRight" &&
        dx !== -1

      ) {

        dx = 1;

        dy = 0;

      }

    };


  window.addEventListener(
    "keydown",
    keyHandler
  );


  draw();

  tick();

};
