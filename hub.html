<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Hub</title>

<style>
* {
  box-sizing: border-box;
}

html,body {
  margin:0;
  min-height:100%;
  background:#202124;
  color:#e8eaed;
  font-family:Arial,Roboto,sans-serif;
}

body {
  padding:14px;
}

.card {
  background:#292a2d;
  border:1px solid #3c4043;
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
}

.title {
  font-size:18px;
  font-weight:500;
}

.section {
  color:#9aa0a6;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.6px;
  margin-bottom:10px;
}

.song {
  display:flex;
  gap:12px;
  align-items:center;
}

.art {
  width:64px;
  height:64px;
  border-radius:8px;
  background:#3c4043;
  object-fit:cover;
}

.name {
  font-size:14px;
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist {
  color:#9aa0a6;
  font-size:12px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

input[type=range] {
  width:100%;
  accent-color:#8ab4f8;
}

.progress {
  margin-top:12px;
}

.times {
  display:flex;
  justify-content:space-between;
  color:#9aa0a6;
  font-size:10px;
}

.controls {
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:9px;
}

button {
  height:34px;
  padding:0 11px;
  border:0;
  border-radius:8px;
  background:#35363a;
  color:#e8eaed;
  cursor:pointer;
}

button:hover {
  background:#45464a;
}

.play {
  background:#8ab4f8;
  color:#202124;
  font-weight:500;
}

.play:hover {
  background:#a8c7fa;
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.status {
  color:#9aa0a6;
  font-size:11px;
  margin-top:8px;
}

.hidden {
  display:none;
}

.game {
  width:100%;
  height:180px;
  margin-top:10px;
  border:1px solid #3c4043;
  border-radius:10px;
  background:#202124;
}

.game-buttons {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
</style>
</head>

<body>

<div class="card">
  <div class="section">My Hub</div>

  <div class="song">
    <img id="art" class="art">

    <div style="min-width:0">
      <div id="song" class="name">Nothing playing</div>
      <div id="artist" class="artist">
        Spotify
      </div>
    </div>
  </div>

  <div class="progress">
    <input
      id="progress"
      type="range"
      min="0"
      max="1000"
      value="0"
    >

    <div class="times">
      <span id="current">0:00</span>
      <span id="duration">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button id="prev">⏮</button>
    <button id="back">−10</button>
    <button id="play" class="play">▶</button>
    <button id="forward">+10</button>
    <button id="next">⏭</button>
  </div>

  <div style="margin-top:8px">
    <input
      id="volume"
      type="range"
      min="0"
      max="100"
      value="50"
    >
  </div>

  <div id="status" class="status">
    Connecting to Spotify...
  </div>
</div>

<div class="card">
  <div class="section">Quick Links</div>

  <div class="grid">
    <button onclick="window.open('https://www.google.com')">
      Google
    </button>

    <button onclick="window.open('https://www.youtube.com')">
      YouTube
    </button>

    <button onclick="window.open('https://drive.google.com')">
      Drive
    </button>

    <button onclick="window.open('https://github.com')">
      GitHub
    </button>
  </div>
</div>

<div class="card">
  <div class="section">Mini Games</div>

  <div class="game-buttons">
    <button id="clicker">🖱 Clicker</button>
    <button id="reaction">⚡ Reaction</button>
    <button id="guess">🔢 Guess</button>
    <button id="snake">🐍 Snake</button>
  </div>

  <div id="game"></div>
</div>

<script>

const CLIENT_ID = "d3445d44d1314d07b1d7a7904bbe5a48";

/* ---------- Spotify ---------- */

async function refreshToken() {

  const refresh =
    localStorage.getItem("spotify_refresh_token");

  if (!refresh)
    throw new Error("Spotify needs to be connected.");

  const body = new URLSearchParams({
    grant_type:"refresh_token",
    refresh_token:refresh,
    client_id:CLIENT_ID
  });

  const r = await fetch(
    "https://accounts.spotify.com/api/token",
    {
      method:"POST",
      headers:{
        "Content-Type":
          "application/x-www-form-urlencoded"
      },
      body:body.toString()
    }
  );

  const d = await r.json();

  if (!r.ok)
    throw new Error(
      d.error_description || "Token refresh failed."
    );

  localStorage.setItem(
    "spotify_access_token",
    d.access_token
  );

  if (d.refresh_token) {
    localStorage.setItem(
      "spotify_refresh_token",
      d.refresh_token
    );
  }

  localStorage.setItem(
    "spotify_expires_at",
    Date.now() + d.expires_in * 1000
  );

  return d.access_token;
}

async function token() {

  const t =
    localStorage.getItem("spotify_access_token");

  const expires =
    Number(
      localStorage.getItem(
        "spotify_expires_at"
      ) || 0
    );

  if (t && Date.now() < expires - 60000)
    return t;

  return refreshToken();
}

async function spotify(endpoint, options={}) {

  let t = await token();

  let r = await fetch(
    "https://api.spotify.com/v1" + endpoint,
    {
      ...options,
      headers:{
        ...(options.headers || {}),
        Authorization:"Bearer " + t
      }
    }
  );

  if (r.status === 401) {

    t = await refreshToken();

    r = await fetch(
      "https://api.spotify.com/v1" + endpoint,
      {
        ...options,
        headers:{
          ...(options.headers || {}),
          Authorization:"Bearer " + t
        }
      }
    );
  }

  if (r.status === 204)
    return null;

  const text = await r.text();

  const data = text ? JSON.parse(text) : null;

  if (!r.ok)
    throw new Error(
      data?.error?.message ||
      "Spotify error " + r.status
    );

  return data;
}

function time(ms) {

  ms = Math.floor(ms / 1000);

  const m = Math.floor(ms / 60);

  const s = String(ms % 60).padStart(2,"0");

  return m + ":" + s;
}

let playback = null;

async function update() {

  try {

    playback =
      await spotify("/me/player");

    if (!playback || !playback.item) {

      document.getElementById("song")
        .textContent = "Nothing playing";

      document.getElementById("artist")
        .textContent = "Open Spotify and play something";

      document.getElementById("status")
        .textContent = "Connected";

      return;
    }

    const item = playback.item;

    document.getElementById("song")
      .textContent = item.name;

    document.getElementById("artist")
      .textContent =
        item.artists.map(x => x.name).join(", ");

    const image =
      item.album?.images?.[1]?.url ||
      item.album?.images?.[0]?.url;

    if (image)
      document.getElementById("art").src = image;

    const duration =
      item.duration_ms || 0;

    const position =
      playback.progress_ms || 0;

    document.getElementById("progress").value =
      duration
        ? position / duration * 1000
        : 0;

    document.getElementById("current")
      .textContent = time(position);

    document.getElementById("duration")
      .textContent = time(duration);

    document.getElementById("play").textContent =
      playback.is_playing
        ? "⏸"
        : "▶";

    document.getElementById("status")
      .textContent =
        "Playing on " +
        (playback.device?.name || "Spotify");

  } catch(e) {

    document.getElementById("status")
      .textContent = e.message;

  }
}

document.getElementById("play").onclick =
async () => {

  try {

    if (playback?.is_playing) {

      await spotify(
        "/me/player/pause",
        {method:"PUT"}
      );

    } else {

      await spotify(
        "/me/player/play",
        {method:"PUT"}
      );

    }

    update();

  } catch(e) {

    document.getElementById("status")
      .textContent = e.message;

  }
};

document.getElementById("prev").onclick =
async () => {

  try {

    await spotify(
      "/me/player/previous",
      {method:"POST"}
    );

    setTimeout(update,500);

  } catch(e) {

    document.getElementById("status")
      .textContent = e.message;

  }
};

document.getElementById("next").onclick =
async () => {

  try {

    await spotify(
      "/me/player/next",
      {method:"POST"}
    );

    setTimeout(update,500);

  } catch(e) {

    document.getElementById("status")
      .textContent = e.message;

  }
};

document.getElementById("back").onclick =
async () => {

  if (!playback?.item) return;

  const p =
    Math.max(
      0,
      (playback.progress_ms || 0) - 10000
    );

  await spotify(
    "/me/player/seek?position_ms=" + p,
    {method:"PUT"}
  );

  update();
};

document.getElementById("forward").onclick =
async () => {

  if (!playback?.item) return;

  const p =
    Math.min(
      playback.item.duration_ms,
      (playback.progress_ms || 0) + 10000
    );

  await spotify(
    "/me/player/seek?position_ms=" + p,
    {method:"PUT"}
  );

  update();
};

document.getElementById("progress").onchange =
async e => {

  if (!playback?.item) return;

  const position =
    playback.item.duration_ms *
    Number(e.target.value) / 1000;

  await spotify(
    "/me/player/seek?position_ms=" +
    Math.floor(position),
    {method:"PUT"}
  );

  update();
};

document.getElementById("volume").onchange =
async e => {

  await spotify(
    "/me/player/volume?volume_percent=" +
    e.target.value,
    {method:"PUT"}
  );

};

setInterval(update,4000);

update();


/* ---------- Games ---------- */

const game = document.getElementById("game");

document.getElementById("clicker").onclick = () => {

  game.innerHTML = `
    <div style="text-align:center;padding:25px">
      <div style="font-size:28px">
        <span id="score">0</span>
      </div>
      <button id="click">CLICK</button>
    </div>
  `;

  let score = 0;

  document.getElementById("click").onclick =
  () => {

    score++;

    document.getElementById("score")
      .textContent = score;

  };

};

document.getElementById("guess").onclick = () => {

  const answer =
    Math.floor(Math.random()*100)+1;

  game.innerHTML = `
    <div style="padding:15px">
      <input
        id="guessInput"
        type="number"
        min="1"
        max="100"
        placeholder="1-100"
        style="
          width:100%;
          height:34px;
          background:#202124;
          color:white;
          border:1px solid #3c4043;
          border-radius:8px;
          padding:0 8px;
        "
      >

      <button id="guessBtn"
        style="margin-top:7px">
        Guess
      </button>

      <div id="guessResult"
        class="status">
      </div>
    </div>
  `;

  document.getElementById("guessBtn").onclick = () => {

    const n =
      Number(
        document.getElementById("guessInput").value
      );

    document.getElementById("guessResult")
      .textContent =
        n === answer
          ? "🎉 Correct!"
          : n < answer
            ? "Too low"
            : "Too high";

  };

};

document.getElementById("reaction").onclick = () => {

  game.innerHTML = `
    <div style="text-align:center;padding:15px">
      <button
        id="reactionButton"
        style="
          width:100%;
          height:120px;
          font-size:20px;
        ">
        WAIT...
      </button>

      <div id="reactionResult"
        class="status">
      </div>
    </div>
  `;

  const button =
    document.getElementById("reactionButton");

  const result =
    document.getElementById("reactionResult");

  let ready = false;

  const start =
    setTimeout(() => {

      ready = true;

      button.textContent = "GO!";

    },1000 + Math.random()*2500);

  button.onclick = () => {

    if (!ready) {

      clearTimeout(start);

      button.textContent =
        "Too early!";

      return;

    }

    result.textContent =
      "Nice reaction!";

  };

};

</script>

</body>
</html>
